name: Ops / GCP cost controls

on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      dev_database_action:
        description: Start, stop, or inspect the development Cloud SQL instance.
        required: true
        default: status
        type: choice
        options: [status, start, stop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-cost-controls-dev-database
  cancel-in-progress: false

jobs:
  dev-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Scheduled workflows always run from the default branch. Keep this operational job outside
      # the branch-gated deployment Environments and use dedicated repository-level dev controls.
      GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      DEV_DATABASE_INSTANCE: ${{ vars.DEV_CLOUDSQL_INSTANCE }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.DEV_COST_WORKLOAD_IDENTITY_PROVIDER }}
      COST_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.DEV_COST_CONTROLLER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate dedicated cost-control configuration
        shell: pwsh
        run: |
          $required = @{
            GCP_PROJECT_ID = $env:GCP_PROJECT_ID
            DEV_DATABASE_INSTANCE = $env:DEV_DATABASE_INSTANCE
            WORKLOAD_IDENTITY_PROVIDER = $env:WORKLOAD_IDENTITY_PROVIDER
            COST_CONTROLLER_SERVICE_ACCOUNT = $env:COST_CONTROLLER_SERVICE_ACCOUNT
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing repository variable(s): $($missing -join ', ')."
          }
          if ($env:DEV_DATABASE_INSTANCE -notmatch '-dev$') {
            throw "Refusing non-development Cloud SQL instance '$env:DEV_DATABASE_INSTANCE'."
          }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.COST_CONTROLLER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Resolve requested state
        id: action
        shell: pwsh
        run: |
          $action = "${{ inputs.dev_database_action || '' }}"
          if ([string]::IsNullOrWhiteSpace($action)) {
            $action = if ("${{ github.event.schedule }}" -eq "30 2 * * 1-5") { "start" } else { "stop" }
          }
          "value=$action" >> $env:GITHUB_OUTPUT
          "Development database action: $action" >> $env:GITHUB_STEP_SUMMARY

      - name: Apply development database state
        shell: pwsh
        run: |
          ./scripts/set-dev-cloudsql-state.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -InstanceName "$env:DEV_DATABASE_INSTANCE" `
            -State "${{ steps.action.outputs.value }}" `
            -Wait

  # Deliberately has no `needs:` on dev-database. Reporting is observability, and a billing-export
  # hiccup must never be able to leave the development database running.
  artifact-registry-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skipped entirely when no billing export table is configured, rather than run and fail.
    #
    # This job failed every scheduled run from 2026-08-19 onward, and the cause is worth recording: the
    # env below used to end in `|| 'custoking.billing_export.…'`. That fallback named the pre-split
    # project, so when the variable was unset the job did not fail loudly -- it queried a table in a
    # project this identity could not read, and after 2026-08-20 could not exist at all.
    #
    # Worse, the fallback DEFEATED THE GUARD BELOW. "Validate cost-report configuration" exists to catch
    # a missing BILLING_EXPORT_TABLE, but a default guarantees the value is always present, so the check
    # passed every time and the failure surfaced later as an opaque BigQuery error instead.
    #
    # With the fallback gone the condition is honest: no table configured means nothing to report, so
    # the job skips. It resumes by itself the moment the variable is set, which is the right behaviour
    # while the usage-cost export for billing account 014C0A remains unfixable on Google's side.
    if: vars.BILLING_EXPORT_TABLE != ''
    env:
      GCP_PROJECT_ID: ${{ vars.DEV_GCP_PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.DEV_COST_WORKLOAD_IDENTITY_PROVIDER }}
      COST_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.DEV_COST_CONTROLLER_SERVICE_ACCOUNT }}
      BILLING_EXPORT_TABLE: ${{ vars.BILLING_EXPORT_TABLE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate cost-report configuration
        shell: pwsh
        run: |
          $required = @{
            GCP_PROJECT_ID = $env:GCP_PROJECT_ID
            WORKLOAD_IDENTITY_PROVIDER = $env:WORKLOAD_IDENTITY_PROVIDER
            COST_CONTROLLER_SERVICE_ACCOUNT = $env:COST_CONTROLLER_SERVICE_ACCOUNT
            BILLING_EXPORT_TABLE = $env:BILLING_EXPORT_TABLE
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Missing repository variable(s): $($missing -join ', ')."
          }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.COST_CONTROLLER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Report Artifact Registry egress
        shell: pwsh
        run: |
          ./scripts/report-artifact-registry-egress.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -BillingTable "$env:BILLING_EXPORT_TABLE" `
            -Days 14
