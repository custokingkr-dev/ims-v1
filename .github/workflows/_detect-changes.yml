name: Reusable / Detect affected services

on:
  workflow_call:
    inputs:
      base_ref:
        required: false
        type: string
      head_ref:
        required: false
        type: string
        default: HEAD
    outputs:
      has_service_changes:
        value: ${{ jobs.detect.outputs.has_service_changes }}
      service_matrix:
        value: ${{ jobs.detect.outputs.service_matrix }}
      docker_matrix:
        value: ${{ jobs.detect.outputs.docker_matrix }}
      changed_files:
        value: ${{ jobs.detect.outputs.changed_files }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_service_changes: ${{ steps.detect.outputs.has_service_changes }}
      service_matrix: ${{ steps.detect.outputs.service_matrix }}
      docker_matrix: ${{ steps.detect.outputs.docker_matrix }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected services
        id: detect
        shell: pwsh
        run: |
          $baseRef = '${{ inputs.base_ref }}'
          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            if ('${{ github.event_name }}' -eq 'pull_request') {
              $baseRef = 'origin/${{ github.base_ref }}'
            } else {
              $baseRef = 'HEAD~1'
            }
          }
          if ($baseRef.StartsWith('origin/')) {
            git fetch origin ($baseRef -replace '^origin/', '') --depth=1
          }
          $json = ./scripts/resolve-affected-ci-targets.ps1 -BaseRef $baseRef -HeadRef '${{ inputs.head_ref }}'
          $result = $json | ConvertFrom-Json
          "has_service_changes=$($result.has_service_changes.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "service_matrix=$($result.service_matrix | ConvertTo-Json -Depth 20 -Compress)" >> $env:GITHUB_OUTPUT
          "docker_matrix=$($result.docker_matrix | ConvertTo-Json -Depth 20 -Compress)" >> $env:GITHUB_OUTPUT
          "changed_files=$($result.changed_files | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          "### Changed files" >> $env:GITHUB_STEP_SUMMARY
          $result.changed_files | ForEach-Object { "- $_" >> $env:GITHUB_STEP_SUMMARY }
