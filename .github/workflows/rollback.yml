name: CD / Rollback target

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll back, or all.
        required: true
        default: all
        type: choice
        options:
          - all
          - school-core-service
          - identity-service
          - operations-service
          - billing-service
          - platform-service
          - api-gateway
          - frontend
      environment:
        description: Target environment to roll back.
        required: true
        type: choice
        options: [dev, prod]
      release_id:
        description: Optional release to roll back to. Empty means last successful release.
        required: false
        type: string
      reason:
        description: Required rollback reason.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-rollback-${{ inputs.environment }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'custoking' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south2' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  ROLLBACK_SERVICE_ACCOUNT: ${{ vars.ROLLBACK_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.ROLLBACK_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Roll back selected targets
        shell: pwsh
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID: ${{ vars.STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $requested = '${{ inputs.service }}'
          $envName = '${{ inputs.environment }}'
          ./scripts/render-clouddeploy-targets.ps1 -Environment $envName -OutputPath "artifacts/clouddeploy/targets-$envName.rendered.yaml"
          gcloud deploy apply --file="artifacts/clouddeploy/targets-$envName.rendered.yaml" --project="$env:GCP_PROJECT_ID" --region="$env:GCP_REGION"
          $services = if ($requested -eq 'all') {
            @("frontend", "api-gateway", "platform-service", "billing-service", "operations-service", "identity-service", "school-core-service")
          } else {
            @($requested)
          }
          New-Item -ItemType Directory -Force -Path rollback-evidence | Out-Null
          $summary = @()
          foreach ($service in $services) {
            $pipeline = "custoking-$service-$envName"
            $target = "$service-$envName"
            $rolloutId = ("rollback-{0}-{1}" -f "${{ github.run_id }}", ($service -replace "-", "")).ToLowerInvariant()
            $args = @(
              "deploy", "targets", "rollback", $target,
              "--project=$env:GCP_PROJECT_ID",
              "--region=$env:GCP_REGION",
              "--delivery-pipeline=$pipeline",
              "--rollout-id=$rolloutId",
              "--quiet"
            )
            $release = '${{ inputs.release_id }}'
            if (-not [string]::IsNullOrWhiteSpace($release)) {
              $args += "--release=$release"
            }
            gcloud @args
            $summary += [ordered]@{ service = $service; pipeline = $pipeline; target = $target; rollout = $rolloutId; release = $release }
          }
          [ordered]@{
            environment = $envName
            reason = '${{ inputs.reason }}'
            rolledBackAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            rollbacks = $summary
          } | ConvertTo-Json -Depth 10 | Set-Content rollback-evidence/rollback.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rollback-${{ inputs.environment }}-${{ github.run_id }}
          path: rollback-evidence
          if-no-files-found: error
