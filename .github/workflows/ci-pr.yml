name: CI / PR

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      base_ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

  service-test:
    name: service-test (${{ matrix.name }})
    needs: detect
    if: ${{ needs.detect.outputs.has_service_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.service_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: ${{ matrix.tool == 'maven' }}
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ matrix.tool != 'maven' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install Node dependencies
        if: ${{ matrix.tool != 'maven' }}
        working-directory: ${{ matrix.path }}
        run: npm ci --include=dev
      - name: Run Maven tests
        if: ${{ matrix.tool == 'maven' }}
        working-directory: ${{ matrix.path }}
        run: mvn -B test --no-transfer-progress
      - name: Run gateway tests
        if: ${{ matrix.tool == 'node' }}
        working-directory: ${{ matrix.path }}
        run: node --test server.test.js
      - name: Run frontend tests and build
        if: ${{ matrix.tool == 'npm' }}
        working-directory: ${{ matrix.path }}
        run: |
          npm audit --audit-level=high
          npm test
          npm run build

  docker-build:
    name: docker-build (${{ matrix.name }})
    needs: detect
    if: ${{ needs.detect.outputs.has_service_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Set image reference
        run: echo "IMAGE_REF=ci/${{ matrix.image }}:${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [detect, service-test, docker-build, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI PR Summary"
            echo ""
            echo "- Service changes: ${{ needs.detect.outputs.has_service_changes }}"
            echo "- Service tests: ${{ needs.service-test.result }}"
            echo "- Docker builds: ${{ needs.docker-build.result }}"
            echo "- Secret scan: ${{ needs.secret-scan.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce required job results
        shell: bash
        run: |
          failed=0
          for result in \
            "${{ needs.detect.result }}" \
            "${{ needs.service-test.result }}" \
            "${{ needs.docker-build.result }}" \
            "${{ needs.secret-scan.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
