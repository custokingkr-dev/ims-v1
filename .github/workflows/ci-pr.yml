name: CI / PR

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source-policy:
    name: promotion-source-policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require dev as the source of main promotions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "Pull requests to main must be promoted from dev; received source '$HEAD_REF'." >&2
            exit 1
          fi

  detect:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      base_ref: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

  # Cheap, no credentials, no GCP. Runs on every PR regardless of what changed, because the failure it
  # catches is precisely a change that touched one service and forgot the others.
  duplicate-class-drift:
    name: duplicate-class-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check guarded classes have not diverged
        run: python3 scripts/check-duplicate-class-drift.py

  # Offline architectural invariants are cheap enough to run on every PR. Keeping them
  # independent from the affected-service matrix catches cross-service contract drift even
  # when a PR changes only deployment configuration, smoke coverage, or an audit baseline.
  static-architecture-audits:
    name: static-architecture-audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Verify generated OpenAPI clients are current
        run: node scripts/generate-openapi-typescript-client.js --check
      - name: Audit offline service boundaries
        shell: pwsh
        run: |
          ./scripts/audit-deployment-boundaries.ps1
          ./scripts/audit-microservice-runtime-boundaries.ps1
          ./scripts/audit-service-authorization-boundaries.ps1
          ./scripts/audit-runtime-schema-dependency-baseline.ps1
          ./scripts/audit-service-contract-coverage.ps1
          ./scripts/audit-service-package-shape.ps1
          ./scripts/audit-service-schema-defaults.ps1
          ./scripts/audit-service-datasource-pool.ps1
          ./scripts/audit-microservice-test-catalog.ps1
          ./scripts/audit-microservice-build-catalog.ps1
          ./scripts/audit-security-governance-controls.ps1
      - name: Test immutable GitHub governance check verification
        run: python3 -m unittest scripts.tests.test_verify_github_governance_checks
      - name: Test offline GCP governance audits
        run: python3 -m unittest scripts.tests.test_export_gcp_asset_drift scripts.tests.test_audit_gcp_observability scripts.tests.test_validate_gcp_governance_audit_enablement
      - name: Test OpenAPI CI routing invariants
        run: python3 -m unittest scripts.tests.test_openapi_ci_gate

  privacy-technical-controls:
    name: privacy-technical-controls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Audit current, branch, history and release export boundaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/audit-repository-data-boundaries.ps1
          ./scripts/audit-repository-export-history.ps1
      - name: Run synthetic export and verified-deletion drill
        shell: pwsh
        run: ./scripts/invoke-privacy-export-erasure-drill.ps1

  maven-wrapper-validation:
    name: maven-wrapper-validation (${{ matrix.os }})
    needs: detect
    if: >-
      ${{
        contains(needs.detect.outputs.changed_files, 'mvnw') ||
        contains(needs.detect.outputs.changed_files, '.mvn/wrapper/')
      }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wrapper: ./mvnw
          - os: windows-latest
            wrapper: .\mvnw.cmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify pinned wrapper from an empty wrapper home
        shell: pwsh
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-wrapper-${{ matrix.os }}
        run: |
          $properties = Get-Content -Raw .mvn/wrapper/maven-wrapper.properties | ConvertFrom-StringData
          if ($properties.wrapperVersion -ne "3.3.4") {
            throw "Expected Maven Wrapper 3.3.4; found '$($properties.wrapperVersion)'."
          }
          if ($properties.distributionType -ne "only-script") {
            throw "Maven Wrapper must retain only-script distribution type."
          }
          if ($properties.distributionSha256Sum -notmatch '^[0-9a-f]{64}$') {
            throw "Maven distribution must have a lowercase SHA-256 pin."
          }
          if (Test-Path -LiteralPath $env:MAVEN_USER_HOME) {
            throw "Cold wrapper home unexpectedly exists: $env:MAVEN_USER_HOME"
          }
          $versionOutput = & "${{ matrix.wrapper }}" --version 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Maven Wrapper version command failed: $($versionOutput -join [Environment]::NewLine)"
          }
          $versionText = $versionOutput -join [Environment]::NewLine
          $versionText
          if ($versionText -notmatch '(?m)^Apache Maven 3\.9\.16(?:\s|$)') {
            throw "Expected Apache Maven 3.9.16 from the wrapper."
          }
      - name: Run representative reactor tests through the wrapper
        if: ${{ matrix.os == 'ubuntu-latest' }}
        shell: bash
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-wrapper-${{ matrix.os }}
        run: >-
          ./mvnw -B -pl services/identity-service
          -Dtest=JwtServiceTest,TenantScopeTest
          -Dmaven.repo.local="$HOME/.m2/repository"
          test --no-transfer-progress

  service-test:
    name: service-test (${{ matrix.name }})
    needs: detect
    if: ${{ needs.detect.outputs.has_service_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.service_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: ${{ matrix.tool == 'maven' }}
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ matrix.tool != 'maven' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json
      - name: Install Node dependencies
        if: ${{ matrix.tool != 'maven' }}
        working-directory: ${{ matrix.path }}
        run: npm ci --include=dev
      - name: Run Maven tests
        if: ${{ matrix.tool == 'maven' }}
        working-directory: ${{ matrix.path }}
        run: mvn -B test --no-transfer-progress
      - name: Run gateway tests
        if: ${{ matrix.tool == 'node' }}
        working-directory: ${{ matrix.path }}
        run: node --test server.test.js
      - name: Run frontend tests and build
        if: ${{ matrix.tool == 'npm' }}
        working-directory: ${{ matrix.path }}
        run: |
          npm audit --audit-level=high
          npm run test:coverage
          npm run build
      - name: Install Playwright Chromium
        if: ${{ matrix.tool == 'npm' }}
        working-directory: ${{ matrix.path }}
        run: npx playwright install --with-deps chromium
      - name: Run authenticated frontend browser tests
        if: ${{ matrix.tool == 'npm' }}
        working-directory: ${{ matrix.path }}
        run: npm run test:e2e

  docker-build:
    name: docker-build (${{ matrix.name }})
    needs: detect
    if: ${{ needs.detect.outputs.has_service_changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Set image reference
        run: echo "IMAGE_REF=ci/${{ matrix.image }}:${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_REF }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [promotion-source-policy, detect, duplicate-class-drift, static-architecture-audits, privacy-technical-controls, maven-wrapper-validation, service-test, docker-build, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## CI PR Summary"
            echo ""
            echo "- Promotion source policy: ${{ needs.promotion-source-policy.result }}"
            echo "- Service changes: ${{ needs.detect.outputs.has_service_changes }}"
            echo "- Service tests: ${{ needs.service-test.result }}"
            echo "- Docker builds: ${{ needs.docker-build.result }}"
            echo "- Duplicate class drift: ${{ needs.duplicate-class-drift.result }}"
            echo "- Static architecture audits: ${{ needs.static-architecture-audits.result }}"
            echo "- Privacy technical controls: ${{ needs.privacy-technical-controls.result }}"
            echo "- Maven wrapper validation: ${{ needs.maven-wrapper-validation.result }}"
            echo "- Secret scan: ${{ needs.secret-scan.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce required job results
        shell: bash
        run: |
          failed=0
          for result in \
            "${{ needs.promotion-source-policy.result }}" \
            "${{ needs.detect.result }}" \
            "${{ needs.duplicate-class-drift.result }}" \
            "${{ needs.static-architecture-audits.result }}" \
            "${{ needs.privacy-technical-controls.result }}" \
            "${{ needs.maven-wrapper-validation.result }}" \
            "${{ needs.service-test.result }}" \
            "${{ needs.docker-build.result }}" \
            "${{ needs.secret-scan.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required CI jobs failed or were cancelled." >&2
            exit 1
          fi
