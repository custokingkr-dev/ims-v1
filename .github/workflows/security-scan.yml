name: Security / Container scan

on:
  schedule:
    - cron: "30 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity-service, context: ., dockerfile: services/identity-service/Dockerfile, image: custoking-identity-service }
          - { name: school-core-service, context: ., dockerfile: services/school-core-service/Dockerfile, image: custoking-school-core-service }
          - { name: operations-service, context: ., dockerfile: services/operations-service/Dockerfile, image: custoking-operations-service }
          - { name: platform-service, context: ., dockerfile: services/platform-service/Dockerfile, image: custoking-platform-service }
          - { name: billing-service, context: ., dockerfile: services/billing-service/Dockerfile, image: custoking-billing-service }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile, image: custoking-frontend }
          - { name: api-gateway, context: services/api-gateway, dockerfile: services/api-gateway/Dockerfile, image: custoking-api-gateway }
          # The dashboard is not under services/ and is not built by build-release.yml, so it was
          # absent from every scan in this repo -- and it is the ONLY service reachable from the
          # internet. On 2026-08-21 it was found running with 138 vulnerabilities, 5 CRITICAL and
          # 47 HIGH, all of them fixable. Nothing had failed; nothing had ever looked.
          #
          # tools/live-dashboard/release.sh gates a manual release, but only when somebody releases.
          # This entry is what notices a base image that goes stale while nobody is rebuilding, which
          # is exactly how it got to 138 in the first place.
          - { name: dashboard, context: tools/live-dashboard, dockerfile: tools/live-dashboard/Dockerfile, image: custoking-dashboard }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: security/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
      - name: Trivy HIGH/CRITICAL gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: security/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: security/${{ matrix.image }}:${{ github.sha }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: ${{ matrix.name }}

  cleanup-legacy-analyses:
    name: Remove superseded Trivy analysis categories
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify current analyses and delete only legacy categories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          analyses="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=refs/heads/main&tool_name=Trivy&per_page=100")"

          stable_count="$(jq --arg sha "${GITHUB_SHA}" '[
            .[][]
            | select(.commit_sha == $sha)
            | select(
                .category == "identity-service"
                or .category == "school-core-service"
                or .category == "operations-service"
                or .category == "platform-service"
                or .category == "billing-service"
                or .category == "frontend"
                or .category == "api-gateway"
              )
          ] | unique_by(.category) | length' <<<"${analyses}")"

          if [[ "${stable_count}" != "7" ]]; then
            echo "Expected seven current stable-category analyses at ${GITHUB_SHA}; found ${stable_count}." >&2
            exit 1
          fi

          legacy="$(jq '[
            .[][]
            | select(.ref == "refs/heads/main")
            | select(.category | startswith(".github/workflows/security-scan.yml:"))
          ]' <<<"${analyses}")"
          legacy_count="$(jq 'length' <<<"${legacy}")"
          echo "Superseded analysis count: ${legacy_count}"

          while IFS= read -r analysis; do
            analysis_id="$(jq -r '.id' <<<"${analysis}")"
            category="$(jq -r '.category' <<<"${analysis}")"
            deletable="$(jq -r '.deletable' <<<"${analysis}")"

            if [[ ! "${analysis_id}" =~ ^[0-9]+$ || "${deletable}" != "true" ]]; then
              echo "Refusing unsafe analysis deletion: id=${analysis_id} deletable=${deletable}." >&2
              exit 1
            fi
            if [[ "${category}" != .github/workflows/security-scan.yml:* ]]; then
              echo "Refusing non-legacy category deletion: ${category}." >&2
              exit 1
            fi

            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/code-scanning/analyses/${analysis_id}?confirm_delete=true" \
              >/dev/null
            echo "Deleted superseded Trivy analysis ${analysis_id}."
          done < <(jq -c '.[]' <<<"${legacy}")
