name: CD / Deploy branch environment

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment. dev requires the dev branch; prod requires main.
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      commit_sha:
        description: Commit SHA to release. Must belong to the selected environment branch.
        required: false
        type: string
      force_full_deploy:
        description: Deploy every service even if its source did not change.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: cd-environment-${{ inputs.target_environment || (github.ref_name == 'main' && 'prod') || 'dev' }}
  cancel-in-progress: ${{ github.ref_name == 'dev' || inputs.target_environment == 'dev' }}

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'custoking' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south2' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'custoking' }}
  # The registry project is deliberately SEPARATE from the runtime project. Production never builds: it
  # promotes by resolving a dev-approved-<sourceId> tag. If the registry followed GCP_PROJECT_ID, splitting
  # dev and prod into different projects would leave production looking in an empty registry and every
  # promotion would fail with "No dev-approved image exists".
  ARTIFACT_REGISTRY_PROJECT_ID: ${{ vars.ARTIFACT_REGISTRY_PROJECT_ID || vars.GCP_PROJECT_ID }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  RELEASE_BUILDER_SERVICE_ACCOUNT: ${{ vars.RELEASE_BUILDER_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}
  # Digest-keyed Trivy verdict cache. Scanning pulls each image from Artifact Registry to this
  # runner, which is billed internet egress; reusing a recent verdict for an unchanged digest
  # avoids the pull. Absent or unreachable, every service simply scans as before.
  SCAN_EVIDENCE_BUCKET: ${{ vars.SCAN_EVIDENCE_BUCKET || 'custoking-scan-evidence' }}
  SCAN_EVIDENCE_TTL_HOURS: "24"

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.resolve.outputs.target_env }}
      deploy_branch: ${{ steps.resolve.outputs.deploy_branch }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $targetEnv = "${{ inputs.target_environment || '' }}"

          if ($eventName -ne "workflow_dispatch") {
            if ($refName -eq "dev") {
              $targetEnv = "dev"
            } elseif ($refName -eq "main") {
              $targetEnv = "prod"
            } else {
              throw "Unsupported deployment branch '$refName'. Only dev and main deploy."
            }
          }

          $deployBranch = if ($targetEnv -eq "dev") { "dev" } elseif ($targetEnv -eq "prod") { "main" } else { "" }
          if ([string]::IsNullOrWhiteSpace($deployBranch)) {
            throw "Unsupported target environment '$targetEnv'."
          }
          if ($refName -ne $deployBranch) {
            throw "Environment '$targetEnv' deploys only from branch '$deployBranch'. Current branch is '$refName'."
          }

          $sha = "${{ inputs.commit_sha || github.sha }}"
          $before = "${{ github.event.before || '' }}"
          $allZero = $before -match "^0+$"
          $baseRef = if ($eventName -eq "push" -and -not [string]::IsNullOrWhiteSpace($before) -and -not $allZero) {
            $before
          } else {
            "$sha^"
          }

          "target_env=$targetEnv" >> $env:GITHUB_OUTPUT
          "deploy_branch=$deployBranch" >> $env:GITHUB_OUTPUT
          "commit_sha=$sha" >> $env:GITHUB_OUTPUT
          "base_ref=$baseRef" >> $env:GITHUB_OUTPUT
          "Resolved $deployBranch -> $targetEnv for $sha (base $baseRef)"

  detect:
    needs: resolve-target
    uses: ./.github/workflows/_detect-changes.yml
    with:
      base_ref: ${{ needs.resolve-target.outputs.base_ref }}
      head_ref: ${{ needs.resolve-target.outputs.commit_sha }}
      checkout_ref: ${{ needs.resolve-target.outputs.commit_sha }}
      force_all: ${{ inputs.force_full_deploy || (github.event_name == 'workflow_dispatch' && inputs.commit_sha != '') }}
      target_environment: ${{ needs.resolve-target.outputs.target_env }}

  build-images:
    needs: [resolve-target, detect]
    if: ${{ needs.resolve-target.outputs.target_env == 'dev' && needs.detect.outputs.has_service_changes == 'true' && needs.detect.outputs.deployment_reconciliation_required != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-target.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify commit belongs to dev
        shell: pwsh
        run: |
          $sha = "${{ needs.resolve-target.outputs.commit_sha }}"
          git fetch origin dev --quiet
          git merge-base --is-ancestor $sha origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $sha is not reachable from origin/dev."
          }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_BUILDER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Export gcloud access token
        id: gcloud-access-token
        shell: bash
        run: echo "token=$(gcloud auth print-access-token)" >> "$GITHUB_OUTPUT"

      - name: Login Docker to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcloud-access-token.outputs.token }}

      - name: Resolve content-addressed image
        id: source
        shell: pwsh
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceArguments = @{
            CommitSha = "${{ needs.resolve-target.outputs.commit_sha }}"
            Context = "${{ matrix.context }}"
            BuildArgs = [string]$env:BUILD_ARGS
          }
          $metadata = ./scripts/resolve-image-source-id.ps1 @sourceArguments | ConvertFrom-Json
          $registry = "$env:GCP_REGION-docker.pkg.dev/$env:ARTIFACT_REGISTRY_PROJECT_ID/$env:ARTIFACT_REGISTRY_REPOSITORY"
          $sourceRef = "$registry/${{ matrix.image }}:$($metadata.sourceTag)"
          $shaRef = "$registry/${{ matrix.image }}:sha-${{ needs.resolve-target.outputs.commit_sha }}"
          $digestOutput = & gcloud artifacts docker images describe $sourceRef --format="value(image_summary.digest)" 2>$null
          $describeExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $digest = if ($null -eq $digestOutput) { "" } else { ([string]$digestOutput).Trim() }
          $exists = $describeExitCode -eq 0 -and $digest -match "^sha256:[0-9a-f]{64}$"

          "source_id=$($metadata.sourceId)" >> $env:GITHUB_OUTPUT
          "source_tag=$($metadata.sourceTag)" >> $env:GITHUB_OUTPUT
          "source_ref=$sourceRef" >> $env:GITHUB_OUTPUT
          "sha_ref=$shaRef" >> $env:GITHUB_OUTPUT
          "existing_digest=$digest" >> $env:GITHUB_OUTPUT
          "should_build=$(( -not $exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) {
            "Reusing $sourceRef@$digest"
          } else {
            "No existing source image found; building $sourceRef"
          }

      - name: Attach commit tag to reused image
        if: ${{ steps.source.outputs.should_build == 'false' }}
        shell: pwsh
        run: |
          $expectedDigest = "${{ steps.source.outputs.existing_digest }}"
          $existingOutput = & gcloud artifacts docker images describe "${{ steps.source.outputs.sha_ref }}" --format="value(image_summary.digest)" 2>$null
          $describeExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $existingDigest = if ($null -eq $existingOutput) { "" } else { ([string]$existingOutput).Trim() }
          if ($describeExitCode -eq 0) {
            if ($existingDigest -ne $expectedDigest) {
              throw "Commit tag conflict: expected $expectedDigest but found $existingDigest."
            }
            Write-Host "Commit tag already points to $expectedDigest."
          } else {
            gcloud artifacts docker tags add `
              "${{ steps.source.outputs.source_ref }}" `
              "${{ steps.source.outputs.sha_ref }}" `
              --quiet
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create commit image tag."
            }
          }

      - name: Build and push image
        id: build
        if: ${{ steps.source.outputs.should_build == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.source.outputs.source_ref }}
            ${{ steps.source.outputs.sha_ref }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Write image summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.source.outputs.existing_digest }}
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo ""
            echo "- source tag: ${{ steps.source.outputs.source_tag }}"
            echo "- digest: ${IMAGE_DIGEST}"
            echo "- reused: ${{ steps.source.outputs.should_build == 'false' }}"
            echo "- cache: GitHub Actions / ${{ matrix.image }}"
            echo "- provenance: BuildKit mode=max"
            echo "- sbom: BuildKit SBOM attestation"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [resolve-target, detect, build-images]
    if: ${{ always() && needs.detect.outputs.has_service_changes == 'true' && needs.detect.outputs.deployment_reconciliation_required != 'true' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      RELEASE_BUILDER_SERVICE_ACCOUNT: ${{ vars.RELEASE_BUILDER_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}
      CLOUD_DEPLOY_SOURCE_STAGING_DIR: ${{ vars.CLOUD_DEPLOY_SOURCE_STAGING_DIR }}
      # These MUST be re-declared here. The workflow-level env block resolves `vars` in workflow scope,
      # where environment-scoped variables do not exist, so it silently yields the REPOSITORY value. That
      # was harmless while dev and prod lived in one project and every value was identical; after the
      # split the repository value is custoking-dev, so a production release would have deployed
      # production into the development project. The three above were already re-declared for exactly
      # this reason; these were missed only because they used to agree.
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      STUDENT_PHOTO_BUCKET: ${{ vars.STUDENT_PHOTO_BUCKET }}
      ARTIFACT_REGISTRY_PROJECT_ID: ${{ vars.ARTIFACT_REGISTRY_PROJECT_ID || vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-target.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify commit belongs to environment branch
        shell: pwsh
        run: |
          $sha = "${{ needs.resolve-target.outputs.commit_sha }}"
          $branch = "${{ needs.resolve-target.outputs.deploy_branch }}"
          git fetch origin $branch --quiet
          git merge-base --is-ancestor $sha "origin/$branch"
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $sha is not reachable from origin/$branch."
          }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_BUILDER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Initialize release evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release-evidence | Out-Null

      - name: Ensure development database is running
        id: dev_database
        if: ${{ needs.resolve-target.outputs.target_env == 'dev' }}
        shell: pwsh
        env:
          AFFECTED_MATRIX_JSON: ${{ needs.detect.outputs.docker_matrix }}
        run: |
          $matrix = $env:AFFECTED_MATRIX_JSON | ConvertFrom-Json
          $databaseBackedServices = @(
            "identity-service",
            "school-core-service",
            "operations-service",
            "platform-service",
            "billing-service"
          )
          $needsDatabase = @(
            $matrix.include | Where-Object {
              $databaseBackedServices -contains [string]$_.name
            }
          ).Count -gt 0

          if (-not $needsDatabase) {
            Write-Host "Skipping development Cloud SQL start: no database-backed service is affected."
            exit 0
          }

          # Record the state we found so the run can put it back. Deploys previously started the
          # instance and left activation policy at ALWAYS, so a single dev deploy turned a
          # deliberately stopped database into one running indefinitely at about INR 29/day until
          # somebody noticed or the scheduled cost-control sweep caught it.
          # Runner is ubuntu-latest, so the CLI is "gcloud"; the .cmd shim is Windows-only. Resolved
          # the same way as scripts/set-dev-cloudsql-state.ps1 so this keeps working if that changes.
          $gcloud = if ($env:OS -eq "Windows_NT") { "gcloud.cmd" } else { "gcloud" }
          $state = ((& $gcloud sql instances describe custoking-db-dev `
            "--project=$env:GCP_PROJECT_ID" --format="value(state)") -join "").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the development Cloud SQL state before starting it."
          }
          $wasRunning = $state -eq "RUNNABLE"
          Write-Host "Development database state before deploy: $state"
          "restore_to_stopped=$(if ($wasRunning) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

          ./scripts/set-dev-cloudsql-state.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -InstanceName custoking-db-dev `
            -State start `
            -Wait

      - name: Configure Docker for Artifact Registry inspection
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Resolve immutable release images
        id: images
        shell: pwsh
        env:
          AFFECTED_MATRIX_JSON: ${{ needs.detect.outputs.docker_matrix }}
        run: |
          $ErrorActionPreference = "Stop"
          $targetEnv = "${{ needs.resolve-target.outputs.target_env }}"
          $sha = "${{ needs.resolve-target.outputs.commit_sha }}"
          # Two registries, deliberately. Resolution reads from the BUILD project, because that is where
          # the dev-approved tag lives. Deployment must reference the TARGET project, because Cloud Run
          # re-pulls on every scale-out: leaving production pointed at the build project's registry makes
          # a development project a runtime dependency of production, so pruning an image there degrades
          # prod. For dev the two are the same and nothing is copied.
          $sourceRegistry  = "$env:GCP_REGION-docker.pkg.dev/$env:ARTIFACT_REGISTRY_PROJECT_ID/$env:ARTIFACT_REGISTRY_REPOSITORY"
          $runtimeRegistry = "$env:GCP_REGION-docker.pkg.dev/$env:GCP_PROJECT_ID/$env:ARTIFACT_REGISTRY_REPOSITORY"
          $registry = $sourceRegistry
          $matrix = $env:AFFECTED_MATRIX_JSON | ConvertFrom-Json
          $services = @()

          foreach ($entry in @($matrix.include)) {
            $sourceArguments = @{
              CommitSha = $sha
              Context = [string]$entry.context
              BuildArgs = [string]$entry.build_args
            }
            $metadata = ./scripts/resolve-image-source-id.ps1 @sourceArguments | ConvertFrom-Json
            $resolvedTag = if ($targetEnv -eq "prod") {
              "dev-approved-$($metadata.sourceTag)"
            } else {
              $metadata.sourceTag
            }
            $tagRef = "$registry/$($entry.image):$resolvedTag"
            $digestOutput = & gcloud artifacts docker images describe $tagRef --format="value(image_summary.digest)" 2>$null
            $describeExitCode = $LASTEXITCODE
            $digest = if ($null -eq $digestOutput) { "" } else { ([string]$digestOutput).Trim() }
            if ($describeExitCode -ne 0 -or $digest -notmatch "^sha256:[0-9a-f]{64}$") {
              if ($targetEnv -eq "prod") {
                throw "No dev-approved image exists for $($entry.name) source $($metadata.sourceId). Deploy this source to dev successfully before production."
              }
              throw "No built image exists for $($entry.name) source $($metadata.sourceId)."
            }

            $rawManifest = (& docker buildx imagetools inspect --raw $tagRef) -join "`n"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($rawManifest)) {
              throw "Could not inspect OCI manifest for $tagRef."
            }
            $manifest = $rawManifest | ConvertFrom-Json
            $runtimeDigest = $digest
            if (@($manifest.manifests).Count -gt 0) {
              $runtimeDescriptor = $manifest.manifests | Where-Object {
                $_.platform.os -eq "linux" -and $_.platform.architecture -eq "amd64"
              } | Select-Object -First 1
              if (-not $runtimeDescriptor -or [string]$runtimeDescriptor.digest -notmatch "^sha256:[0-9a-f]{64}$") {
                throw "OCI index $tagRef does not contain a runnable linux/amd64 manifest."
              }
              $runtimeDigest = [string]$runtimeDescriptor.digest
            }

            # Promote the resolved digest into the target project's registry before anything references
            # it. imagetools create is a server-side manifest copy -- it moves no layers and completes in
            # seconds -- and because images are content addressed, the digest is identical on both sides,
            # so the promoted reference is provably the same bytes that were approved on dev.
            if ($runtimeRegistry -ne $sourceRegistry) {
              & docker buildx imagetools create --tag "$runtimeRegistry/$($entry.image):$resolvedTag" "$sourceRegistry/$($entry.image)@$digest"
              if ($LASTEXITCODE -ne 0) {
                throw "Could not promote $($entry.image)@$digest into $runtimeRegistry."
              }
              $promoted = & gcloud artifacts docker images describe "$runtimeRegistry/$($entry.image):$resolvedTag" --format="value(image_summary.digest)" 2>$null
              $promotedDigest = if ($null -eq $promoted) { "" } else { ([string]$promoted).Trim() }
              # A copy that lands under a different digest would mean the bytes changed in transit. Deploying
              # that would silently ship something other than what dev approved and what Trivy scanned.
              if ($promotedDigest -ne $digest) {
                throw "Promoted digest $promotedDigest does not match approved digest $digest for $($entry.image)."
              }
            }

            $immutableRef = "$runtimeRegistry/$($entry.image)@$digest"
            $scanKey = switch ([string]$entry.name) {
              "identity-service" { "identity" }
              "school-core-service" { "school_core" }
              "operations-service" { "operations" }
              "platform-service" { "platform" }
              "billing-service" { "billing" }
              "frontend" { "frontend" }
              "api-gateway" { "api_gateway" }
              default { throw "Unsupported release image '$($entry.name)' cannot be mapped to a scan gate." }
            }
            "${scanKey}_ref=$immutableRef" >> $env:GITHUB_OUTPUT
            "${scanKey}_digest_key=$($digest.Replace(':', '-'))" >> $env:GITHUB_OUTPUT

            $services += [ordered]@{
              service = [string]$entry.name
              image = [string]$entry.image
              context = [string]$entry.context
              sourceId = [string]$metadata.sourceId
              sourceTag = [string]$metadata.sourceTag
              resolvedTag = $resolvedTag
              digest = $digest
              immutableRef = $immutableRef
              runtimeDigest = $runtimeDigest
              runtimeRef = "$runtimeRegistry/$($entry.image)@$runtimeDigest"
            }
          }

          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          [ordered]@{
            commit = $sha
            environment = $targetEnv
            registry = $registry
            resolvedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            services = $services
          } | ConvertTo-Json -Depth 10 | Set-Content release-evidence/images.json

          New-Item -ItemType Directory -Force -Path release-evidence/trivy | Out-Null

      # Scanning an image pulls it from Artifact Registry to this runner, which sits outside GCP and
      # is therefore billed internet egress. A release resolves all seven services whether or not they
      # were rebuilt, so unchanged digests were being re-pulled on every run. Reuse a stored verdict
      # when the same immutable digest was already scanned by the same scanner inside the TTL. Any
      # failure here is a cache miss, never a build failure: the gate still fails closed.
      - name: Restore cached Trivy verdicts
        id: scan_cache
        if: always()
        shell: pwsh
        env:
          TRIVY_ACTION_SHA: ed142fd0673e97e23eac54620cfb913e5ce36c25
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $scanKeys = [ordered]@{
            "identity-service"    = "identity"
            "school-core-service" = "school_core"
            "operations-service"  = "operations"
            "platform-service"    = "platform"
            "billing-service"     = "billing"
            "frontend"            = "frontend"
            "api-gateway"         = "api_gateway"
          }

          $cached = [ordered]@{}
          foreach ($value in $scanKeys.Values) { $cached[$value] = $false }
          $restored = @()

          $bucket = [string]$env:SCAN_EVIDENCE_BUCKET
          $ttlHours = [double]$env:SCAN_EVIDENCE_TTL_HOURS
          $actionSha = [string]$env:TRIVY_ACTION_SHA

          if ([string]::IsNullOrWhiteSpace($bucket)) {
            Write-Host "No scan evidence bucket configured. Every resolved image will be scanned."
          } elseif (-not (Test-Path -LiteralPath "release-evidence/images.json" -PathType Leaf)) {
            Write-Host "No images.json present. Every resolved image will be scanned."
          } else {
            New-Item -ItemType Directory -Force -Path release-evidence/trivy | Out-Null
            $manifest = Get-Content -LiteralPath release-evidence/images.json -Raw | ConvertFrom-Json
            foreach ($entry in @($manifest.services)) {
              $service = [string]$entry.service
              if (-not $scanKeys.Contains($service)) { continue }
              $key = [string]$scanKeys[$service]
              $digest = [string]$entry.digest
              if ($digest -notmatch "^sha256:[0-9a-f]{64}$") { continue }
              $digestKey = $digest.Replace(":", "-")
              $base = "gs://$bucket/trivy/v1/$service/$digestKey"
              $tablePath = "release-evidence/trivy/$service-$digestKey.table.txt"
              $sarifPath = "release-evidence/trivy/$service-$digestKey.sarif"

              try {
                $raw = (& gcloud storage cat "$base/verdict.json" 2>$null) -join "`n"
                $catExitCode = $LASTEXITCODE
                $global:LASTEXITCODE = 0
                if ($catExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($raw)) {
                  Write-Host "miss $service - no stored verdict"
                  continue
                }

                $verdict = $raw | ConvertFrom-Json
                if ([string]$verdict.digestKey -ne $digestKey) {
                  Write-Host "miss $service - stored verdict is for a different digest"
                  continue
                }
                if ([string]$verdict.trivyAction -ne $actionSha) {
                  Write-Host "miss $service - stored verdict came from a different scanner revision"
                  continue
                }
                if ([string]$verdict.gate -ne "success" -or [string]$verdict.sarif -ne "success") {
                  Write-Host "miss $service - stored verdict is not a pass"
                  continue
                }

                $scannedAt = [datetimeoffset]::Parse(
                  [string]$verdict.scannedAtUtc, [cultureinfo]::InvariantCulture).UtcDateTime
                $ageHours = ([datetime]::UtcNow - $scannedAt).TotalHours
                if ($ageHours -lt 0 -or $ageHours -gt $ttlHours) {
                  Write-Host ("miss {0} - verdict is {1:N1}h old, TTL is {2}h" -f $service, $ageHours, $ttlHours)
                  continue
                }

                & gcloud storage cp "$base/evidence.table.txt" $tablePath --quiet 2>$null | Out-Null
                $tableOk = $LASTEXITCODE -eq 0
                $global:LASTEXITCODE = 0
                & gcloud storage cp "$base/evidence.sarif" $sarifPath --quiet 2>$null | Out-Null
                $sarifOk = $LASTEXITCODE -eq 0
                $global:LASTEXITCODE = 0

                $tableOk = $tableOk -and (Test-Path -LiteralPath $tablePath -PathType Leaf) -and
                  (Get-Item -LiteralPath $tablePath).Length -gt 0
                $sarifOk = $sarifOk -and (Test-Path -LiteralPath $sarifPath -PathType Leaf) -and
                  (Get-Item -LiteralPath $sarifPath).Length -gt 0

                if (-not ($tableOk -and $sarifOk)) {
                  Remove-Item -LiteralPath $tablePath -Force -ErrorAction SilentlyContinue
                  Remove-Item -LiteralPath $sarifPath -Force -ErrorAction SilentlyContinue
                  Write-Host "miss $service - stored evidence incomplete"
                  continue
                }

                $cached[$key] = $true
                $restored += [ordered]@{
                  service = $service
                  digestKey = $digestKey
                  scannedAtUtc = [string]$verdict.scannedAtUtc
                  ageHours = [math]::Round($ageHours, 2)
                }
                Write-Host ("hit  {0} - reusing verdict {1:N1}h old, no registry pull" -f $service, $ageHours)
              } catch {
                $global:LASTEXITCODE = 0
                Write-Host "miss $service - $($_.Exception.Message)"
              }
            }

            [ordered]@{
              bucket = $bucket
              ttlHours = $ttlHours
              scanner = $actionSha
              restored = $restored
            } | ConvertTo-Json -Depth 6 | Set-Content release-evidence/trivy/scan-cache.json
          }

          foreach ($key in $cached.Keys) {
            $value = if ($cached[$key]) { "true" } else { "false" }
            "${key}_cached=$value" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Reused $($restored.Count) of $($cached.Count) verdicts."
          $global:LASTEXITCODE = 0

      - name: Trivy exact-digest HIGH/CRITICAL gate (identity-service)
        id: trivy_gate_identity
        if: ${{ always() && steps.images.outputs.identity_ref != '' && steps.scan_cache.outputs.identity_cached != 'true' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.identity_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/identity-service-${{ steps.images.outputs.identity_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (identity-service)
