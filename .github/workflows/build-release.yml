name: CD / Build release and deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to release. Defaults to workflow SHA.
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: cd-build-release
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'custoking' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south2' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'custoking' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  RELEASE_BUILDER_SERVICE_ACCOUNT: ${{ vars.RELEASE_BUILDER_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: school-core-service, context: services/school-core-service, image: custoking-school-core-service, build_args: "" }
          - { service: identity-service, context: services/identity-service, image: custoking-identity-service, build_args: "" }
          - { service: operations-service, context: services/operations-service, image: custoking-operations-service, build_args: "" }
          - { service: billing-service, context: services/billing-service, image: custoking-billing-service, build_args: "" }
          - { service: platform-service, context: services/platform-service, image: custoking-platform-service, build_args: "" }
          - { service: api-gateway, context: services/api-gateway, image: custoking-api-gateway, build_args: "" }
          - { service: frontend, context: frontend, image: custoking-frontend, build_args: "VITE_API_BASE_URL=/api/v1" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_BUILDER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ matrix.image }}:sha-${{ inputs.commit_sha || github.sha }}
          build-args: ${{ matrix.build_args }}
          provenance: mode=max
          sbom: true

      - name: Generate image provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write image summary
        run: |
          {
            echo "## ${{ matrix.service }}"
            echo ""
            echo "- image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ matrix.image }}"
            echo "- digest: ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  create-dev-releases:
    needs: build-images
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_BUILDER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: docker/setup-buildx-action@v3

      - name: Apply Cloud Deploy configuration
        env:
          DEV_DB_HOST: ${{ vars.DEV_DB_HOST }}
          DEV_DB_NAME: ${{ vars.DEV_DB_NAME }}
          DEV_STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID: ${{ vars.DEV_STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID }}
          PROD_DB_HOST: ${{ vars.PROD_DB_HOST }}
          PROD_DB_NAME: ${{ vars.PROD_DB_NAME }}
          PROD_STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID: ${{ vars.PROD_STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/render-clouddeploy-targets.ps1 -Environment dev -OutputPath artifacts/clouddeploy/targets-dev.rendered.yaml
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/render-clouddeploy-targets.ps1 -Environment prod -OutputPath artifacts/clouddeploy/targets-prod.rendered.yaml
          gcloud deploy apply --file artifacts/clouddeploy/targets-dev.rendered.yaml --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}"
          gcloud deploy apply --file artifacts/clouddeploy/targets-prod.rendered.yaml --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}"
          gcloud deploy apply --file deploy/clouddeploy/delivery-pipelines.yaml --project="${GCP_PROJECT_ID}" --region="${GCP_REGION}"

      - name: Create ordered Cloud Deploy releases
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/microservice-build-catalog.ps1

          $sha = "${{ inputs.commit_sha || github.sha }}"
          $shortSha = $sha.Substring(0, [Math]::Min(12, $sha.Length))
          $registry = "$env:GCP_REGION-docker.pkg.dev/$env:GCP_PROJECT_ID/$env:ARTIFACT_REGISTRY_REPOSITORY"
          $builds = @{}
          foreach ($entry in @(Get-MicroserviceBuildCatalog)) {
            $builds[$entry.Name] = $entry
          }
          $releaseOrder = @(
            "school-core-service",
            "identity-service",
            "operations-service",
            "billing-service",
            "platform-service",
            "api-gateway",
            "frontend"
          )
          $evidence = [ordered]@{
            commit = $sha
            registry = $registry
            createdAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            services = @()
          }
          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null

          foreach ($name in $releaseOrder) {
            $entry = $builds[$name]
            if (-not $entry) { throw "Missing build catalog entry for $name" }
            $tag = "$registry/$($entry.Image):sha-$sha"
            $digest = docker buildx imagetools inspect $tag --format '{{.Manifest.Digest}}'
            if ([string]::IsNullOrWhiteSpace($digest) -or -not $digest.StartsWith("sha256:")) {
              throw "Could not resolve digest for $tag"
            }
            $digestRef = "$registry/$($entry.Image)@$digest"
            $releaseId = ("rel-{0}-{1}-{2}" -f $shortSha, ($name -replace "-", ""), "${{ github.run_attempt }}").ToLowerInvariant()
            $pipeline = "custoking-$name"
            gcloud deploy releases create $releaseId `
              --project="$env:GCP_PROJECT_ID" `
              --region="$env:GCP_REGION" `
              --delivery-pipeline="$pipeline" `
              --skaffold-file=deploy/skaffold.yaml `
              --images="$($entry.Image)=$digestRef" `
              --deploy-parameters="git_sha=$sha" `
              --quiet

            $evidence.services += [ordered]@{
              service = $name
              image = $entry.Image
              tag = $tag
              digest = $digestRef
              pipeline = $pipeline
              release = $releaseId
              firstTarget = "$name-dev"
            }
          }

          $evidence | ConvertTo-Json -Depth 10 | Set-Content -Path release-evidence/release.json
          "# Release $shortSha" | Set-Content -Path release-evidence/summary.md
          "" | Add-Content -Path release-evidence/summary.md
          foreach ($svc in $evidence.services) {
            "- $($svc.service): $($svc.digest) -> $($svc.pipeline)/$($svc.release)" | Add-Content -Path release-evidence/summary.md
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ github.sha }}
          path: release-evidence
          if-no-files-found: error
