          format: table
          output: release-evidence/trivy/frontend-${{ steps.images.outputs.frontend_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (frontend)
        id: trivy_sarif_frontend
        if: ${{ always() && steps.images.outputs.frontend_ref != '' && steps.scan_cache.outputs.frontend_cached != 'true' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/frontend-${{ steps.images.outputs.frontend_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (api-gateway)
        id: trivy_gate_api_gateway
        if: ${{ always() && steps.images.outputs.api_gateway_ref != '' && steps.scan_cache.outputs.api_gateway_cached != 'true' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api_gateway_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/api-gateway-${{ steps.images.outputs.api_gateway_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (api-gateway)
        id: trivy_sarif_api_gateway
        if: ${{ always() && steps.images.outputs.api_gateway_ref != '' && steps.scan_cache.outputs.api_gateway_cached != 'true' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api_gateway_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/api-gateway-${{ steps.images.outputs.api_gateway_digest_key }}.sarif

      # Publish verdicts for digests scanned in this run so later runs, including the prod promotion
      # of an already-scanned dev image, can skip the registry pull. Only passes are stored: a failing
      # gate must re-run every time, and a stale failure must never be able to block a fix.
      - name: Store Trivy verdicts for reuse
        if: always()
        shell: pwsh
        env:
          TRIVY_ACTION_SHA: ed142fd0673e97e23eac54620cfb913e5ce36c25
          IDENTITY_CACHED: ${{ steps.scan_cache.outputs.identity_cached }}
          IDENTITY_GATE: ${{ steps.trivy_gate_identity.outcome }}
          IDENTITY_SARIF: ${{ steps.trivy_sarif_identity.outcome }}
          SCHOOL_CORE_CACHED: ${{ steps.scan_cache.outputs.school_core_cached }}
          SCHOOL_CORE_GATE: ${{ steps.trivy_gate_school_core.outcome }}
          SCHOOL_CORE_SARIF: ${{ steps.trivy_sarif_school_core.outcome }}
          OPERATIONS_CACHED: ${{ steps.scan_cache.outputs.operations_cached }}
          OPERATIONS_GATE: ${{ steps.trivy_gate_operations.outcome }}
          OPERATIONS_SARIF: ${{ steps.trivy_sarif_operations.outcome }}
          PLATFORM_CACHED: ${{ steps.scan_cache.outputs.platform_cached }}
          PLATFORM_GATE: ${{ steps.trivy_gate_platform.outcome }}
          PLATFORM_SARIF: ${{ steps.trivy_sarif_platform.outcome }}
          BILLING_CACHED: ${{ steps.scan_cache.outputs.billing_cached }}
          BILLING_GATE: ${{ steps.trivy_gate_billing.outcome }}
          BILLING_SARIF: ${{ steps.trivy_sarif_billing.outcome }}
          FRONTEND_CACHED: ${{ steps.scan_cache.outputs.frontend_cached }}
          FRONTEND_GATE: ${{ steps.trivy_gate_frontend.outcome }}
          FRONTEND_SARIF: ${{ steps.trivy_sarif_frontend.outcome }}
          API_GATEWAY_CACHED: ${{ steps.scan_cache.outputs.api_gateway_cached }}
          API_GATEWAY_GATE: ${{ steps.trivy_gate_api_gateway.outcome }}
          API_GATEWAY_SARIF: ${{ steps.trivy_sarif_api_gateway.outcome }}
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false

          $scanKeys = [ordered]@{
            "identity-service"    = "identity"
            "school-core-service" = "school_core"
            "operations-service"  = "operations"
            "platform-service"    = "platform"
            "billing-service"     = "billing"
            "frontend"            = "frontend"
            "api-gateway"         = "api_gateway"
          }

          $bucket = [string]$env:SCAN_EVIDENCE_BUCKET
          $actionSha = [string]$env:TRIVY_ACTION_SHA

          if ([string]::IsNullOrWhiteSpace($bucket)) {
            Write-Host "No scan evidence bucket configured. Nothing stored."
            exit 0
          }
          if (-not (Test-Path -LiteralPath "release-evidence/images.json" -PathType Leaf)) {
            Write-Host "No images.json present. Nothing stored."
            exit 0
          }

          function Get-EnvValue([string]$name) {
            $item = Get-Item -LiteralPath "Env:$name" -ErrorAction SilentlyContinue
            if ($null -eq $item) { return "" }
            return [string]$item.Value
          }

          $stored = 0
          $manifest = Get-Content -LiteralPath release-evidence/images.json -Raw | ConvertFrom-Json
          foreach ($entry in @($manifest.services)) {
            $service = [string]$entry.service
            if (-not $scanKeys.Contains($service)) { continue }
            $key = [string]$scanKeys[$service]
            $prefix = $key.ToUpperInvariant()
            $digest = [string]$entry.digest
            if ($digest -notmatch "^sha256:[0-9a-f]{64}$") { continue }
            $digestKey = $digest.Replace(":", "-")

            if ((Get-EnvValue "${prefix}_CACHED") -eq "true") { continue }
            if ((Get-EnvValue "${prefix}_GATE") -ne "success") { continue }
            if ((Get-EnvValue "${prefix}_SARIF") -ne "success") { continue }

            $tablePath = "release-evidence/trivy/$service-$digestKey.table.txt"
            $sarifPath = "release-evidence/trivy/$service-$digestKey.sarif"
            $tableOk = (Test-Path -LiteralPath $tablePath -PathType Leaf) -and
              (Get-Item -LiteralPath $tablePath).Length -gt 0
            $sarifOk = (Test-Path -LiteralPath $sarifPath -PathType Leaf) -and
              (Get-Item -LiteralPath $sarifPath).Length -gt 0
            if (-not ($tableOk -and $sarifOk)) { continue }

            $base = "gs://$bucket/trivy/v1/$service/$digestKey"
            try {
              $verdictPath = [System.IO.Path]::GetTempFileName()
              [ordered]@{
                service = $service
                immutableImage = [string]$entry.immutableRef
                digestKey = $digestKey
                scannedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
                trivyAction = $actionSha
                gate = "success"
                sarif = "success"
              } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $verdictPath

              & gcloud storage cp $tablePath "$base/evidence.table.txt" --quiet 2>$null | Out-Null
              $ok = $LASTEXITCODE -eq 0
              $global:LASTEXITCODE = 0
              & gcloud storage cp $sarifPath "$base/evidence.sarif" --quiet 2>$null | Out-Null
              $ok = $ok -and $LASTEXITCODE -eq 0
              $global:LASTEXITCODE = 0
              if ($ok) {
                # Written last so a verdict is only ever visible once both evidence objects exist.
                & gcloud storage cp $verdictPath "$base/verdict.json" --quiet 2>$null | Out-Null
                $ok = $LASTEXITCODE -eq 0
                $global:LASTEXITCODE = 0
              }
              Remove-Item -LiteralPath $verdictPath -Force -ErrorAction SilentlyContinue

              if ($ok) {
                $stored++
                Write-Host "stored $service $digestKey"
              } else {
                Write-Host "could not store $service $digestKey; the next run will rescan it"
              }
            } catch {
              $global:LASTEXITCODE = 0
              Write-Host "could not store $service - $($_.Exception.Message)"
            }
          }

          Write-Host "Stored $stored verdict(s)."
          $global:LASTEXITCODE = 0

      - name: Enforce exact-digest Trivy gates and evidence
        if: always()
        shell: pwsh
        env:
          IDENTITY_REF: ${{ steps.images.outputs.identity_ref }}
          IDENTITY_DIGEST_KEY: ${{ steps.images.outputs.identity_digest_key }}
          IDENTITY_GATE: ${{ steps.trivy_gate_identity.outcome }}
          IDENTITY_SARIF: ${{ steps.trivy_sarif_identity.outcome }}
          IDENTITY_CACHED: ${{ steps.scan_cache.outputs.identity_cached }}
          SCHOOL_CORE_REF: ${{ steps.images.outputs.school_core_ref }}
          SCHOOL_CORE_DIGEST_KEY: ${{ steps.images.outputs.school_core_digest_key }}
          SCHOOL_CORE_GATE: ${{ steps.trivy_gate_school_core.outcome }}
          SCHOOL_CORE_SARIF: ${{ steps.trivy_sarif_school_core.outcome }}
          SCHOOL_CORE_CACHED: ${{ steps.scan_cache.outputs.school_core_cached }}
          OPERATIONS_REF: ${{ steps.images.outputs.operations_ref }}
          OPERATIONS_DIGEST_KEY: ${{ steps.images.outputs.operations_digest_key }}
          OPERATIONS_GATE: ${{ steps.trivy_gate_operations.outcome }}
          OPERATIONS_SARIF: ${{ steps.trivy_sarif_operations.outcome }}
          OPERATIONS_CACHED: ${{ steps.scan_cache.outputs.operations_cached }}
          PLATFORM_REF: ${{ steps.images.outputs.platform_ref }}
          PLATFORM_DIGEST_KEY: ${{ steps.images.outputs.platform_digest_key }}
          PLATFORM_GATE: ${{ steps.trivy_gate_platform.outcome }}
          PLATFORM_SARIF: ${{ steps.trivy_sarif_platform.outcome }}
          PLATFORM_CACHED: ${{ steps.scan_cache.outputs.platform_cached }}
          BILLING_REF: ${{ steps.images.outputs.billing_ref }}
          BILLING_DIGEST_KEY: ${{ steps.images.outputs.billing_digest_key }}
          BILLING_GATE: ${{ steps.trivy_gate_billing.outcome }}
          BILLING_SARIF: ${{ steps.trivy_sarif_billing.outcome }}
          BILLING_CACHED: ${{ steps.scan_cache.outputs.billing_cached }}
          FRONTEND_REF: ${{ steps.images.outputs.frontend_ref }}
          FRONTEND_DIGEST_KEY: ${{ steps.images.outputs.frontend_digest_key }}
          FRONTEND_GATE: ${{ steps.trivy_gate_frontend.outcome }}
          FRONTEND_SARIF: ${{ steps.trivy_sarif_frontend.outcome }}
          FRONTEND_CACHED: ${{ steps.scan_cache.outputs.frontend_cached }}
          API_GATEWAY_REF: ${{ steps.images.outputs.api_gateway_ref }}
          API_GATEWAY_DIGEST_KEY: ${{ steps.images.outputs.api_gateway_digest_key }}
          API_GATEWAY_GATE: ${{ steps.trivy_gate_api_gateway.outcome }}
          API_GATEWAY_SARIF: ${{ steps.trivy_sarif_api_gateway.outcome }}
          API_GATEWAY_CACHED: ${{ steps.scan_cache.outputs.api_gateway_cached }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-evidence/trivy | Out-Null
          $checks = @(
            [pscustomobject]@{ service = "identity-service"; image = $env:IDENTITY_REF; digestKey = $env:IDENTITY_DIGEST_KEY; gate = $env:IDENTITY_GATE; sarif = $env:IDENTITY_SARIF; cached = $env:IDENTITY_CACHED },
            [pscustomobject]@{ service = "school-core-service"; image = $env:SCHOOL_CORE_REF; digestKey = $env:SCHOOL_CORE_DIGEST_KEY; gate = $env:SCHOOL_CORE_GATE; sarif = $env:SCHOOL_CORE_SARIF; cached = $env:SCHOOL_CORE_CACHED },
            [pscustomobject]@{ service = "operations-service"; image = $env:OPERATIONS_REF; digestKey = $env:OPERATIONS_DIGEST_KEY; gate = $env:OPERATIONS_GATE; sarif = $env:OPERATIONS_SARIF; cached = $env:OPERATIONS_CACHED },
            [pscustomobject]@{ service = "platform-service"; image = $env:PLATFORM_REF; digestKey = $env:PLATFORM_DIGEST_KEY; gate = $env:PLATFORM_GATE; sarif = $env:PLATFORM_SARIF; cached = $env:PLATFORM_CACHED },
            [pscustomobject]@{ service = "billing-service"; image = $env:BILLING_REF; digestKey = $env:BILLING_DIGEST_KEY; gate = $env:BILLING_GATE; sarif = $env:BILLING_SARIF; cached = $env:BILLING_CACHED },
            [pscustomobject]@{ service = "frontend"; image = $env:FRONTEND_REF; digestKey = $env:FRONTEND_DIGEST_KEY; gate = $env:FRONTEND_GATE; sarif = $env:FRONTEND_SARIF; cached = $env:FRONTEND_CACHED },
            [pscustomobject]@{ service = "api-gateway"; image = $env:API_GATEWAY_REF; digestKey = $env:API_GATEWAY_DIGEST_KEY; gate = $env:API_GATEWAY_GATE; sarif = $env:API_GATEWAY_SARIF; cached = $env:API_GATEWAY_CACHED }
          )
          $results = @()
          $failures = @()
          foreach ($check in $checks) {
            if ([string]::IsNullOrWhiteSpace([string]$check.image)) {
              continue
            }
            $tablePath = "release-evidence/trivy/$($check.service)-$($check.digestKey).table.txt"
            $sarifPath = "release-evidence/trivy/$($check.service)-$($check.digestKey).sarif"
            $immutable = [string]$check.image -match "@sha256:[0-9a-f]{64}$"
            $tablePresent = (Test-Path -LiteralPath $tablePath -PathType Leaf) -and
              (Get-Item -LiteralPath $tablePath).Length -gt 0
            $sarifPresent = (Test-Path -LiteralPath $sarifPath -PathType Leaf) -and
              (Get-Item -LiteralPath $sarifPath).Length -gt 0
            # A verdict is acceptable either because this run scanned the digest, or because the
            # restore step proved the same immutable digest passed the same scanner inside the TTL
            # and materialised its evidence. Evidence must be present on disk either way.
            $wasCached = ([string]$check.cached) -eq "true"
            $wasScanned = $check.gate -eq "success" -and $check.sarif -eq "success"
            $passed = $immutable -and $tablePresent -and $sarifPresent -and ($wasScanned -or $wasCached)
            $results += [ordered]@{
              service = $check.service
              immutableImage = $check.image
              digestKey = $check.digestKey
              highCriticalGate = $check.gate
              sarifScan = $check.sarif
              source = if ($wasCached) { "cached" } else { "scanned" }
              tableEvidence = $tablePath
              sarifEvidence = $sarifPath
              passed = $passed
            }
            if (-not $passed) {
              $failures += $check.service
            }
          }
          [ordered]@{
            commit = "${{ needs.resolve-target.outputs.commit_sha }}"
            environment = "${{ needs.resolve-target.outputs.target_env }}"
            scanner = "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25"
            scannedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            verdictCacheTtlHours = [double]$env:SCAN_EVIDENCE_TTL_HOURS
            scannedCount = @($results | Where-Object { $_.source -eq "scanned" }).Count
            cachedCount = @($results | Where-Object { $_.source -eq "cached" }).Count
            services = $results
          } | ConvertTo-Json -Depth 10 | Set-Content release-evidence/trivy/exact-digest-scan.json
          if ($failures.Count -gt 0) {
            throw "Exact-digest Trivy gate or evidence generation failed for: $($failures -join ', '). Deployment is blocked."
          }
          if ($results.Count -eq 0) {
            throw "No immutable release image was scanned. Deployment is blocked."
          }

      - name: Fast dev deployment
        if: ${{ needs.resolve-target.outputs.target_env == 'dev' && needs.detect.outputs.deployment_config_changed != 'true' }}
        shell: pwsh
        run: |
          ./scripts/invoke-direct-cloudrun-release.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -Region "$env:GCP_REGION" `
            -Environment dev `
            -ImagesJson release-evidence/images.json `
            -OutputPath release-evidence/deployment.json

      - name: Create and serially promote Cloud Deploy releases
        if: ${{ needs.resolve-target.outputs.target_env == 'prod' || needs.detect.outputs.deployment_config_changed == 'true' }}
        shell: pwsh
        run: |
          $arguments = @{
            ProjectId = "$env:GCP_PROJECT_ID"
            Region = "$env:GCP_REGION"
            Environment = "${{ needs.resolve-target.outputs.target_env }}"
            CommitSha = "${{ needs.resolve-target.outputs.commit_sha }}"
            RunAttempt = "${{ github.run_attempt }}"
            ImagesJson = "release-evidence/images.json"
            OutputPath = "release-evidence/deployment.json"
            WaitForRollout = $true
          }
          if ("${{ needs.resolve-target.outputs.target_env }}" -eq "prod") {
            $arguments.AutoAdvanceCanary = $true
          }
          ./scripts/invoke-clouddeploy-release.ps1 @arguments

      - name: Confirm Cloud Deploy rollouts
        if: ${{ needs.resolve-target.outputs.target_env == 'prod' || needs.detect.outputs.deployment_config_changed == 'true' }}
        shell: pwsh
        run: |
          $arguments = @{
            ProjectId = "$env:GCP_PROJECT_ID"
            Region = "$env:GCP_REGION"
            DeploymentJson = "release-evidence/deployment.json"
          }
          if ("${{ needs.resolve-target.outputs.target_env }}" -eq "prod") {
            $arguments.AutoAdvanceCanary = $true
          }
          ./scripts/wait-clouddeploy-rollouts.ps1 @arguments

      - name: Verify changed Cloud Run services
        shell: pwsh
        run: |
          ./scripts/verify-cloudrun-release.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -Region "$env:GCP_REGION" `
            -Environment "${{ needs.resolve-target.outputs.target_env }}" `
            -ImagesJson release-evidence/images.json `
            -OutputPath release-evidence/services-smoke.json

      - name: Gateway health smoke after rollout
        shell: pwsh
        run: |
          ./scripts/smoke-gateway-health.ps1 `
            -Environment "${{ needs.resolve-target.outputs.target_env }}" `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -Region "$env:GCP_REGION" `
            -OutputPath release-evidence/gateway-smoke.json

      - name: Approve dev-tested image digests for production
        if: ${{ needs.resolve-target.outputs.target_env == 'dev' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $images = Get-Content -Raw release-evidence/images.json | ConvertFrom-Json
          $approvals = @()
          foreach ($service in @($images.services)) {
            $approvalRef = "$($images.registry)/$($service.image):dev-approved-$($service.sourceTag)"
            $existingOutput = & gcloud artifacts docker images describe $approvalRef --format="value(image_summary.digest)" 2>$null
            $describeExitCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $existingDigest = if ($null -eq $existingOutput) { "" } else { ([string]$existingOutput).Trim() }
            if ($describeExitCode -eq 0) {
              if ($existingDigest -ne [string]$service.digest) {
                throw "Approval tag conflict for $($service.service): expected $($service.digest) but found $existingDigest."
              }
              Write-Host "Approval tag for $($service.service) already points to $existingDigest."
            } else {
              gcloud artifacts docker tags add $service.immutableRef $approvalRef --quiet
              if ($LASTEXITCODE -ne 0) {
                throw "Could not approve $($service.service) digest $($service.immutableRef)."
              }
            }
            $approvals += [ordered]@{
              service = [string]$service.service
              sourceId = [string]$service.sourceId
              image = [string]$service.immutableRef
              approvalTag = $approvalRef
            }
          }
          [ordered]@{
            commit = "${{ needs.resolve-target.outputs.commit_sha }}"
            approvedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            services = $approvals
          } | ConvertTo-Json -Depth 10 | Set-Content release-evidence/dev-approvals.json

      - name: Write release summary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          $lines = @(
            "# Release ${{ needs.resolve-target.outputs.commit_sha }}",
            "",
            "- environment: ${{ needs.resolve-target.outputs.target_env }}",
            "- changed deployment config: ${{ needs.detect.outputs.deployment_config_changed }}",
            "- workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          if (Test-Path release-evidence/deployment.json) {
            $deployment = Get-Content -Raw release-evidence/deployment.json | ConvertFrom-Json
            $lines += "- deployment mode: $($deployment.mode)"
          }
          if (Test-Path release-evidence/images.json) {
            $images = Get-Content -Raw release-evidence/images.json | ConvertFrom-Json
            $lines += ""
            $lines += "## Images"
            foreach ($service in @($images.services)) {
              $lines += "- $($service.service): $($service.immutableRef)"
            }
          }
          $lines | Set-Content release-evidence/summary.md
          $lines | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }

      # Put the development database back as it was found. Runs on failure and cancellation too:
      # a deploy that dies midway is exactly the case that used to leave the instance running.
      # Only stops what this run started, so a database someone is actively using stays up.
      - name: Restore development database state
        if: ${{ always() && needs.resolve-target.outputs.target_env == 'dev' && steps.dev_database.outputs.restore_to_stopped == 'true' }}
        shell: pwsh
        run: |
          Write-Host "Development database was stopped before this deploy; returning it to that state."
          ./scripts/set-dev-cloudsql-state.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -InstanceName custoking-db-dev `
            -State stop `
            -Wait

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-evidence-${{ needs.resolve-target.outputs.target_env }}-${{ needs.resolve-target.outputs.commit_sha }}
          path: release-evidence
          if-no-files-found: error

  no-deployment:
    needs: [resolve-target, detect]
    if: ${{ needs.detect.outputs.has_service_changes != 'true' && needs.detect.outputs.deployment_reconciliation_required != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain no-op
        run: echo "No deployable service changed; deployment skipped." >> "$GITHUB_STEP_SUMMARY"

  configuration-reconciliation-required:
    needs: [resolve-target, detect]
    if: ${{ needs.detect.outputs.deployment_reconciliation_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block automatic release for control-plane configuration
        run: |
          {
            echo "## Manual deployment reconciliation required"
            echo ""
            echo "This change modifies Cloud Deploy targets, pipelines, or their renderer."
            echo "No image was built and no release was created."
            echo "Run the protected Ops / Reconcile deployment configuration workflow first, then release services in separate service-specific commits."
          } >> "$GITHUB_STEP_SUMMARY"
