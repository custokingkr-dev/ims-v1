          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/identity-service-${{ steps.images.outputs.identity_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (school-core-service)
        id: trivy_gate_school_core
        if: ${{ always() && steps.images.outputs.school_core_ref != '' && steps.scan_cache.outputs.school_core_cached != 'true' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.school_core_ref }}
