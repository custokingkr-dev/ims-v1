name: CD / Deploy branch environment

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Target environment. dev requires the dev branch; prod requires main.
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      commit_sha:
        description: Commit SHA to release. Must belong to the selected environment branch.
        required: false
        type: string
      force_full_deploy:
        description: Deploy every service even if its source did not change.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write

concurrency:
  group: cd-environment-${{ inputs.target_environment || (github.ref_name == 'main' && 'prod') || 'dev' }}
  cancel-in-progress: ${{ github.ref_name == 'dev' || inputs.target_environment == 'dev' }}

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'custoking' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south2' }}
  ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY || 'custoking' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  RELEASE_BUILDER_SERVICE_ACCOUNT: ${{ vars.RELEASE_BUILDER_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.resolve.outputs.target_env }}
      deploy_branch: ${{ steps.resolve.outputs.deploy_branch }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - id: resolve
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $targetEnv = "${{ inputs.target_environment || '' }}"

          if ($eventName -ne "workflow_dispatch") {
            if ($refName -eq "dev") {
              $targetEnv = "dev"
            } elseif ($refName -eq "main") {
              $targetEnv = "prod"
            } else {
              throw "Unsupported deployment branch '$refName'. Only dev and main deploy."
            }
          }

          $deployBranch = if ($targetEnv -eq "dev") { "dev" } elseif ($targetEnv -eq "prod") { "main" } else { "" }
          if ([string]::IsNullOrWhiteSpace($deployBranch)) {
            throw "Unsupported target environment '$targetEnv'."
          }
          if ($refName -ne $deployBranch) {
            throw "Environment '$targetEnv' deploys only from branch '$deployBranch'. Current branch is '$refName'."
          }

          $sha = "${{ inputs.commit_sha || github.sha }}"
          $before = "${{ github.event.before || '' }}"
          $allZero = $before -match "^0+$"
          $baseRef = if ($eventName -eq "push" -and -not [string]::IsNullOrWhiteSpace($before) -and -not $allZero) {
            $before
          } else {
            "$sha^"
          }

          "target_env=$targetEnv" >> $env:GITHUB_OUTPUT
          "deploy_branch=$deployBranch" >> $env:GITHUB_OUTPUT
          "commit_sha=$sha" >> $env:GITHUB_OUTPUT
          "base_ref=$baseRef" >> $env:GITHUB_OUTPUT
          "Resolved $deployBranch -> $targetEnv for $sha (base $baseRef)"

  detect:
    needs: resolve-target
    uses: ./.github/workflows/_detect-changes.yml
    with:
      base_ref: ${{ needs.resolve-target.outputs.base_ref }}
      head_ref: ${{ needs.resolve-target.outputs.commit_sha }}
      checkout_ref: ${{ needs.resolve-target.outputs.commit_sha }}
      force_all: ${{ inputs.force_full_deploy || (github.event_name == 'workflow_dispatch' && inputs.commit_sha != '') }}
      target_environment: ${{ needs.resolve-target.outputs.target_env }}

  build-images:
    needs: [resolve-target, detect]
    if: ${{ needs.resolve-target.outputs.target_env == 'dev' && needs.detect.outputs.has_service_changes == 'true' && needs.detect.outputs.deployment_reconciliation_required != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect.outputs.docker_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-target.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify commit belongs to dev
        shell: pwsh
        run: |
          $sha = "${{ needs.resolve-target.outputs.commit_sha }}"
          git fetch origin dev --quiet
          git merge-base --is-ancestor $sha origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $sha is not reachable from origin/dev."
          }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_BUILDER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Export gcloud access token
        id: gcloud-access-token
        shell: bash
        run: echo "token=$(gcloud auth print-access-token)" >> "$GITHUB_OUTPUT"

      - name: Login Docker to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcloud-access-token.outputs.token }}

      - name: Resolve content-addressed image
        id: source
        shell: pwsh
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceArguments = @{
            CommitSha = "${{ needs.resolve-target.outputs.commit_sha }}"
            Context = "${{ matrix.context }}"
            BuildArgs = [string]$env:BUILD_ARGS
          }
          $metadata = ./scripts/resolve-image-source-id.ps1 @sourceArguments | ConvertFrom-Json
          $registry = "$env:GCP_REGION-docker.pkg.dev/$env:GCP_PROJECT_ID/$env:ARTIFACT_REGISTRY_REPOSITORY"
          $sourceRef = "$registry/${{ matrix.image }}:$($metadata.sourceTag)"
          $shaRef = "$registry/${{ matrix.image }}:sha-${{ needs.resolve-target.outputs.commit_sha }}"
          $digestOutput = & gcloud artifacts docker images describe $sourceRef --format="value(image_summary.digest)" 2>$null
          $describeExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $digest = if ($null -eq $digestOutput) { "" } else { ([string]$digestOutput).Trim() }
          $exists = $describeExitCode -eq 0 -and $digest -match "^sha256:[0-9a-f]{64}$"

          "source_id=$($metadata.sourceId)" >> $env:GITHUB_OUTPUT
          "source_tag=$($metadata.sourceTag)" >> $env:GITHUB_OUTPUT
          "source_ref=$sourceRef" >> $env:GITHUB_OUTPUT
          "sha_ref=$shaRef" >> $env:GITHUB_OUTPUT
          "existing_digest=$digest" >> $env:GITHUB_OUTPUT
          "should_build=$(( -not $exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($exists) {
            "Reusing $sourceRef@$digest"
          } else {
            "No existing source image found; building $sourceRef"
          }

      - name: Attach commit tag to reused image
        if: ${{ steps.source.outputs.should_build == 'false' }}
        shell: pwsh
        run: |
          $expectedDigest = "${{ steps.source.outputs.existing_digest }}"
          $existingOutput = & gcloud artifacts docker images describe "${{ steps.source.outputs.sha_ref }}" --format="value(image_summary.digest)" 2>$null
          $describeExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $existingDigest = if ($null -eq $existingOutput) { "" } else { ([string]$existingOutput).Trim() }
          if ($describeExitCode -eq 0) {
            if ($existingDigest -ne $expectedDigest) {
              throw "Commit tag conflict: expected $expectedDigest but found $existingDigest."
            }
            Write-Host "Commit tag already points to $expectedDigest."
          } else {
            gcloud artifacts docker tags add `
              "${{ steps.source.outputs.source_ref }}" `
              "${{ steps.source.outputs.sha_ref }}" `
              --quiet
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create commit image tag."
            }
          }

      - name: Build and push image
        id: build
        if: ${{ steps.source.outputs.should_build == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.source.outputs.source_ref }}
            ${{ steps.source.outputs.sha_ref }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Write image summary
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest || steps.source.outputs.existing_digest }}
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo ""
            echo "- source tag: ${{ steps.source.outputs.source_tag }}"
            echo "- digest: ${IMAGE_DIGEST}"
            echo "- reused: ${{ steps.source.outputs.should_build == 'false' }}"
            echo "- cache: GitHub Actions / ${{ matrix.image }}"
            echo "- provenance: BuildKit mode=max"
            echo "- sbom: BuildKit SBOM attestation"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [resolve-target, detect, build-images]
    if: ${{ always() && needs.detect.outputs.has_service_changes == 'true' && needs.detect.outputs.deployment_reconciliation_required != 'true' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-target.outputs.target_env }}
    env:
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      RELEASE_BUILDER_SERVICE_ACCOUNT: ${{ vars.RELEASE_BUILDER_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-target.outputs.commit_sha }}
          fetch-depth: 0

      - name: Verify commit belongs to environment branch
        shell: pwsh
        run: |
          $sha = "${{ needs.resolve-target.outputs.commit_sha }}"
          $branch = "${{ needs.resolve-target.outputs.deploy_branch }}"
          git fetch origin $branch --quiet
          git merge-base --is-ancestor $sha "origin/$branch"
          if ($LASTEXITCODE -ne 0) {
            throw "Commit $sha is not reachable from origin/$branch."
          }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.RELEASE_BUILDER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Initialize release evidence
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release-evidence | Out-Null

      - name: Ensure development database is running
        if: ${{ needs.resolve-target.outputs.target_env == 'dev' }}
        shell: pwsh
        run: |
          ./scripts/set-dev-cloudsql-state.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -InstanceName custoking-db-dev `
            -State start `
            -Wait

      - name: Configure Docker for Artifact Registry inspection
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Resolve immutable release images
        id: images
        shell: pwsh
        env:
          AFFECTED_MATRIX_JSON: ${{ needs.detect.outputs.docker_matrix }}
        run: |
          $ErrorActionPreference = "Stop"
          $targetEnv = "${{ needs.resolve-target.outputs.target_env }}"
          $sha = "${{ needs.resolve-target.outputs.commit_sha }}"
          $registry = "$env:GCP_REGION-docker.pkg.dev/$env:GCP_PROJECT_ID/$env:ARTIFACT_REGISTRY_REPOSITORY"
          $matrix = $env:AFFECTED_MATRIX_JSON | ConvertFrom-Json
          $services = @()

          foreach ($entry in @($matrix.include)) {
            $sourceArguments = @{
              CommitSha = $sha
              Context = [string]$entry.context
              BuildArgs = [string]$entry.build_args
            }
            $metadata = ./scripts/resolve-image-source-id.ps1 @sourceArguments | ConvertFrom-Json
            $resolvedTag = if ($targetEnv -eq "prod") {
              "dev-approved-$($metadata.sourceTag)"
            } else {
              $metadata.sourceTag
            }
            $tagRef = "$registry/$($entry.image):$resolvedTag"
            $digestOutput = & gcloud artifacts docker images describe $tagRef --format="value(image_summary.digest)" 2>$null
            $describeExitCode = $LASTEXITCODE
            $digest = if ($null -eq $digestOutput) { "" } else { ([string]$digestOutput).Trim() }
            if ($describeExitCode -ne 0 -or $digest -notmatch "^sha256:[0-9a-f]{64}$") {
              if ($targetEnv -eq "prod") {
                throw "No dev-approved image exists for $($entry.name) source $($metadata.sourceId). Deploy this source to dev successfully before production."
              }
              throw "No built image exists for $($entry.name) source $($metadata.sourceId)."
            }

            $rawManifest = (& docker buildx imagetools inspect --raw $tagRef) -join "`n"
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($rawManifest)) {
              throw "Could not inspect OCI manifest for $tagRef."
            }
            $manifest = $rawManifest | ConvertFrom-Json
            $runtimeDigest = $digest
            if (@($manifest.manifests).Count -gt 0) {
              $runtimeDescriptor = $manifest.manifests | Where-Object {
                $_.platform.os -eq "linux" -and $_.platform.architecture -eq "amd64"
              } | Select-Object -First 1
              if (-not $runtimeDescriptor -or [string]$runtimeDescriptor.digest -notmatch "^sha256:[0-9a-f]{64}$") {
                throw "OCI index $tagRef does not contain a runnable linux/amd64 manifest."
              }
              $runtimeDigest = [string]$runtimeDescriptor.digest
            }

            $immutableRef = "$registry/$($entry.image)@$digest"
            $scanKey = switch ([string]$entry.name) {
              "identity-service" { "identity" }
              "school-core-service" { "school_core" }
              "operations-service" { "operations" }
              "platform-service" { "platform" }
              "billing-service" { "billing" }
              "frontend" { "frontend" }
              "api-gateway" { "api_gateway" }
              default { throw "Unsupported release image '$($entry.name)' cannot be mapped to a scan gate." }
            }
            "${scanKey}_ref=$immutableRef" >> $env:GITHUB_OUTPUT
            "${scanKey}_digest_key=$($digest.Replace(':', '-'))" >> $env:GITHUB_OUTPUT

            $services += [ordered]@{
              service = [string]$entry.name
              image = [string]$entry.image
              context = [string]$entry.context
              sourceId = [string]$metadata.sourceId
              sourceTag = [string]$metadata.sourceTag
              resolvedTag = $resolvedTag
              digest = $digest
              immutableRef = $immutableRef
              runtimeDigest = $runtimeDigest
              runtimeRef = "$registry/$($entry.image)@$runtimeDigest"
            }
          }

          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          [ordered]@{
            commit = $sha
            environment = $targetEnv
            registry = $registry
            resolvedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            services = $services
          } | ConvertTo-Json -Depth 10 | Set-Content release-evidence/images.json

          New-Item -ItemType Directory -Force -Path release-evidence/trivy | Out-Null

      - name: Trivy exact-digest HIGH/CRITICAL gate (identity-service)
        id: trivy_gate_identity
        if: ${{ always() && steps.images.outputs.identity_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.identity_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/identity-service-${{ steps.images.outputs.identity_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (identity-service)
        id: trivy_sarif_identity
        if: ${{ always() && steps.images.outputs.identity_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.identity_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/identity-service-${{ steps.images.outputs.identity_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (school-core-service)
        id: trivy_gate_school_core
        if: ${{ always() && steps.images.outputs.school_core_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.school_core_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/school-core-service-${{ steps.images.outputs.school_core_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (school-core-service)
        id: trivy_sarif_school_core
        if: ${{ always() && steps.images.outputs.school_core_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.school_core_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/school-core-service-${{ steps.images.outputs.school_core_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (operations-service)
        id: trivy_gate_operations
        if: ${{ always() && steps.images.outputs.operations_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.operations_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/operations-service-${{ steps.images.outputs.operations_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (operations-service)
        id: trivy_sarif_operations
        if: ${{ always() && steps.images.outputs.operations_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.operations_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/operations-service-${{ steps.images.outputs.operations_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (platform-service)
        id: trivy_gate_platform
        if: ${{ always() && steps.images.outputs.platform_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.platform_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/platform-service-${{ steps.images.outputs.platform_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (platform-service)
        id: trivy_sarif_platform
        if: ${{ always() && steps.images.outputs.platform_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.platform_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/platform-service-${{ steps.images.outputs.platform_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (billing-service)
        id: trivy_gate_billing
        if: ${{ always() && steps.images.outputs.billing_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.billing_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/billing-service-${{ steps.images.outputs.billing_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (billing-service)
        id: trivy_sarif_billing
        if: ${{ always() && steps.images.outputs.billing_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.billing_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/billing-service-${{ steps.images.outputs.billing_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (frontend)
        id: trivy_gate_frontend
        if: ${{ always() && steps.images.outputs.frontend_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/frontend-${{ steps.images.outputs.frontend_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (frontend)
        id: trivy_sarif_frontend
        if: ${{ always() && steps.images.outputs.frontend_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/frontend-${{ steps.images.outputs.frontend_digest_key }}.sarif

      - name: Trivy exact-digest HIGH/CRITICAL gate (api-gateway)
        id: trivy_gate_api_gateway
        if: ${{ always() && steps.images.outputs.api_gateway_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api_gateway_ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          format: table
          output: release-evidence/trivy/api-gateway-${{ steps.images.outputs.api_gateway_digest_key }}.table.txt

      - name: Trivy exact-digest SARIF evidence (api-gateway)
        id: trivy_sarif_api_gateway
        if: ${{ always() && steps.images.outputs.api_gateway_ref != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api_gateway_ref }}
          severity: LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: sarif
          output: release-evidence/trivy/api-gateway-${{ steps.images.outputs.api_gateway_digest_key }}.sarif

      - name: Enforce exact-digest Trivy gates and evidence
        if: always()
        shell: pwsh
        env:
          IDENTITY_REF: ${{ steps.images.outputs.identity_ref }}
          IDENTITY_DIGEST_KEY: ${{ steps.images.outputs.identity_digest_key }}
          IDENTITY_GATE: ${{ steps.trivy_gate_identity.outcome }}
          IDENTITY_SARIF: ${{ steps.trivy_sarif_identity.outcome }}
          SCHOOL_CORE_REF: ${{ steps.images.outputs.school_core_ref }}
          SCHOOL_CORE_DIGEST_KEY: ${{ steps.images.outputs.school_core_digest_key }}
          SCHOOL_CORE_GATE: ${{ steps.trivy_gate_school_core.outcome }}
          SCHOOL_CORE_SARIF: ${{ steps.trivy_sarif_school_core.outcome }}
          OPERATIONS_REF: ${{ steps.images.outputs.operations_ref }}
          OPERATIONS_DIGEST_KEY: ${{ steps.images.outputs.operations_digest_key }}
          OPERATIONS_GATE: ${{ steps.trivy_gate_operations.outcome }}
          OPERATIONS_SARIF: ${{ steps.trivy_sarif_operations.outcome }}
          PLATFORM_REF: ${{ steps.images.outputs.platform_ref }}
          PLATFORM_DIGEST_KEY: ${{ steps.images.outputs.platform_digest_key }}
          PLATFORM_GATE: ${{ steps.trivy_gate_platform.outcome }}
          PLATFORM_SARIF: ${{ steps.trivy_sarif_platform.outcome }}
          BILLING_REF: ${{ steps.images.outputs.billing_ref }}
          BILLING_DIGEST_KEY: ${{ steps.images.outputs.billing_digest_key }}
          BILLING_GATE: ${{ steps.trivy_gate_billing.outcome }}
          BILLING_SARIF: ${{ steps.trivy_sarif_billing.outcome }}
          FRONTEND_REF: ${{ steps.images.outputs.frontend_ref }}
          FRONTEND_DIGEST_KEY: ${{ steps.images.outputs.frontend_digest_key }}
          FRONTEND_GATE: ${{ steps.trivy_gate_frontend.outcome }}
          FRONTEND_SARIF: ${{ steps.trivy_sarif_frontend.outcome }}
          API_GATEWAY_REF: ${{ steps.images.outputs.api_gateway_ref }}
          API_GATEWAY_DIGEST_KEY: ${{ steps.images.outputs.api_gateway_digest_key }}
          API_GATEWAY_GATE: ${{ steps.trivy_gate_api_gateway.outcome }}
          API_GATEWAY_SARIF: ${{ steps.trivy_sarif_api_gateway.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path release-evidence/trivy | Out-Null
          $checks = @(
            [pscustomobject]@{ service = "identity-service"; image = $env:IDENTITY_REF; digestKey = $env:IDENTITY_DIGEST_KEY; gate = $env:IDENTITY_GATE; sarif = $env:IDENTITY_SARIF },
            [pscustomobject]@{ service = "school-core-service"; image = $env:SCHOOL_CORE_REF; digestKey = $env:SCHOOL_CORE_DIGEST_KEY; gate = $env:SCHOOL_CORE_GATE; sarif = $env:SCHOOL_CORE_SARIF },
            [pscustomobject]@{ service = "operations-service"; image = $env:OPERATIONS_REF; digestKey = $env:OPERATIONS_DIGEST_KEY; gate = $env:OPERATIONS_GATE; sarif = $env:OPERATIONS_SARIF },
            [pscustomobject]@{ service = "platform-service"; image = $env:PLATFORM_REF; digestKey = $env:PLATFORM_DIGEST_KEY; gate = $env:PLATFORM_GATE; sarif = $env:PLATFORM_SARIF },
            [pscustomobject]@{ service = "billing-service"; image = $env:BILLING_REF; digestKey = $env:BILLING_DIGEST_KEY; gate = $env:BILLING_GATE; sarif = $env:BILLING_SARIF },
            [pscustomobject]@{ service = "frontend"; image = $env:FRONTEND_REF; digestKey = $env:FRONTEND_DIGEST_KEY; gate = $env:FRONTEND_GATE; sarif = $env:FRONTEND_SARIF },
            [pscustomobject]@{ service = "api-gateway"; image = $env:API_GATEWAY_REF; digestKey = $env:API_GATEWAY_DIGEST_KEY; gate = $env:API_GATEWAY_GATE; sarif = $env:API_GATEWAY_SARIF }
          )
          $results = @()
          $failures = @()
          foreach ($check in $checks) {
            if ([string]::IsNullOrWhiteSpace([string]$check.image)) {
              continue
            }
            $tablePath = "release-evidence/trivy/$($check.service)-$($check.digestKey).table.txt"
            $sarifPath = "release-evidence/trivy/$($check.service)-$($check.digestKey).sarif"
            $immutable = [string]$check.image -match "@sha256:[0-9a-f]{64}$"
            $tablePresent = (Test-Path -LiteralPath $tablePath -PathType Leaf) -and
              (Get-Item -LiteralPath $tablePath).Length -gt 0
            $sarifPresent = (Test-Path -LiteralPath $sarifPath -PathType Leaf) -and
              (Get-Item -LiteralPath $sarifPath).Length -gt 0
            $passed = $immutable -and $check.gate -eq "success" -and $check.sarif -eq "success" -and
              $tablePresent -and $sarifPresent
            $results += [ordered]@{
              service = $check.service
              immutableImage = $check.image
              digestKey = $check.digestKey
              highCriticalGate = $check.gate
              sarifScan = $check.sarif
              tableEvidence = $tablePath
              sarifEvidence = $sarifPath
              passed = $passed
            }
            if (-not $passed) {
              $failures += $check.service
            }
          }
          [ordered]@{
            commit = "${{ needs.resolve-target.outputs.commit_sha }}"
            environment = "${{ needs.resolve-target.outputs.target_env }}"
            scanner = "aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25"
            scannedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            services = $results
          } | ConvertTo-Json -Depth 10 | Set-Content release-evidence/trivy/exact-digest-scan.json
          if ($failures.Count -gt 0) {
            throw "Exact-digest Trivy gate or evidence generation failed for: $($failures -join ', '). Deployment is blocked."
          }
          if ($results.Count -eq 0) {
            throw "No immutable release image was scanned. Deployment is blocked."
          }

      - name: Fast dev deployment
        if: ${{ needs.resolve-target.outputs.target_env == 'dev' && needs.detect.outputs.deployment_config_changed != 'true' }}
        shell: pwsh
        run: |
          ./scripts/invoke-direct-cloudrun-release.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -Region "$env:GCP_REGION" `
            -Environment dev `
            -ImagesJson release-evidence/images.json `
            -OutputPath release-evidence/deployment.json

      - name: Create and serially promote Cloud Deploy releases
        if: ${{ needs.resolve-target.outputs.target_env == 'prod' || needs.detect.outputs.deployment_config_changed == 'true' }}
        shell: pwsh
        run: |
          $arguments = @{
            ProjectId = "$env:GCP_PROJECT_ID"
            Region = "$env:GCP_REGION"
            Environment = "${{ needs.resolve-target.outputs.target_env }}"
            CommitSha = "${{ needs.resolve-target.outputs.commit_sha }}"
            RunAttempt = "${{ github.run_attempt }}"
            ImagesJson = "release-evidence/images.json"
            OutputPath = "release-evidence/deployment.json"
            WaitForRollout = $true
          }
          if ("${{ needs.resolve-target.outputs.target_env }}" -eq "prod") {
            $arguments.AutoAdvanceCanary = $true
          }
          ./scripts/invoke-clouddeploy-release.ps1 @arguments

      - name: Confirm Cloud Deploy rollouts
        if: ${{ needs.resolve-target.outputs.target_env == 'prod' || needs.detect.outputs.deployment_config_changed == 'true' }}
        shell: pwsh
        run: |
          $arguments = @{
            ProjectId = "$env:GCP_PROJECT_ID"
            Region = "$env:GCP_REGION"
            DeploymentJson = "release-evidence/deployment.json"
          }
          if ("${{ needs.resolve-target.outputs.target_env }}" -eq "prod") {
            $arguments.AutoAdvanceCanary = $true
          }
          ./scripts/wait-clouddeploy-rollouts.ps1 @arguments

      - name: Verify changed Cloud Run services
        shell: pwsh
        run: |
          ./scripts/verify-cloudrun-release.ps1 `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -Region "$env:GCP_REGION" `
            -Environment "${{ needs.resolve-target.outputs.target_env }}" `
            -ImagesJson release-evidence/images.json `
            -OutputPath release-evidence/services-smoke.json

      - name: Gateway health smoke after rollout
        shell: pwsh
        run: |
          ./scripts/smoke-gateway-health.ps1 `
            -Environment "${{ needs.resolve-target.outputs.target_env }}" `
            -ProjectId "$env:GCP_PROJECT_ID" `
            -Region "$env:GCP_REGION" `
            -OutputPath release-evidence/gateway-smoke.json

      - name: Approve dev-tested image digests for production
        if: ${{ needs.resolve-target.outputs.target_env == 'dev' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $images = Get-Content -Raw release-evidence/images.json | ConvertFrom-Json
          $approvals = @()
          foreach ($service in @($images.services)) {
            $approvalRef = "$($images.registry)/$($service.image):dev-approved-$($service.sourceTag)"
            $existingOutput = & gcloud artifacts docker images describe $approvalRef --format="value(image_summary.digest)" 2>$null
            $describeExitCode = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $existingDigest = if ($null -eq $existingOutput) { "" } else { ([string]$existingOutput).Trim() }
            if ($describeExitCode -eq 0) {
              if ($existingDigest -ne [string]$service.digest) {
                throw "Approval tag conflict for $($service.service): expected $($service.digest) but found $existingDigest."
              }
              Write-Host "Approval tag for $($service.service) already points to $existingDigest."
            } else {
              gcloud artifacts docker tags add $service.immutableRef $approvalRef --quiet
              if ($LASTEXITCODE -ne 0) {
                throw "Could not approve $($service.service) digest $($service.immutableRef)."
              }
            }
            $approvals += [ordered]@{
              service = [string]$service.service
              sourceId = [string]$service.sourceId
              image = [string]$service.immutableRef
              approvalTag = $approvalRef
            }
          }
          [ordered]@{
            commit = "${{ needs.resolve-target.outputs.commit_sha }}"
            approvedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            services = $approvals
          } | ConvertTo-Json -Depth 10 | Set-Content release-evidence/dev-approvals.json

      - name: Write release summary
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          $lines = @(
            "# Release ${{ needs.resolve-target.outputs.commit_sha }}",
            "",
            "- environment: ${{ needs.resolve-target.outputs.target_env }}",
            "- changed deployment config: ${{ needs.detect.outputs.deployment_config_changed }}",
            "- workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          if (Test-Path release-evidence/deployment.json) {
            $deployment = Get-Content -Raw release-evidence/deployment.json | ConvertFrom-Json
            $lines += "- deployment mode: $($deployment.mode)"
          }
          if (Test-Path release-evidence/images.json) {
            $images = Get-Content -Raw release-evidence/images.json | ConvertFrom-Json
            $lines += ""
            $lines += "## Images"
            foreach ($service in @($images.services)) {
              $lines += "- $($service.service): $($service.immutableRef)"
            }
          }
          $lines | Set-Content release-evidence/summary.md
          $lines | ForEach-Object { $_ >> $env:GITHUB_STEP_SUMMARY }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: release-evidence-${{ needs.resolve-target.outputs.target_env }}-${{ needs.resolve-target.outputs.commit_sha }}
          path: release-evidence
          if-no-files-found: error

  no-deployment:
    needs: [resolve-target, detect]
    if: ${{ needs.detect.outputs.has_service_changes != 'true' && needs.detect.outputs.deployment_reconciliation_required != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain no-op
        run: echo "No deployable service changed; deployment skipped." >> "$GITHUB_STEP_SUMMARY"

  configuration-reconciliation-required:
    needs: [resolve-target, detect]
    if: ${{ needs.detect.outputs.deployment_reconciliation_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block automatic release for control-plane configuration
        run: |
          {
            echo "## Manual deployment reconciliation required"
            echo ""
            echo "This change modifies Cloud Deploy targets, pipelines, or their renderer."
            echo "No image was built and no release was created."
            echo "Run the protected Ops / Reconcile deployment configuration workflow first, then release services in separate service-specific commits."
          } >> "$GITHUB_STEP_SUMMARY"
