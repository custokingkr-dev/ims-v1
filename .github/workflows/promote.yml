name: CD / Promote release

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to promote, or all.
        required: true
        default: all
        type: choice
        options:
          - all
          - school-core-service
          - identity-service
          - operations-service
          - billing-service
          - platform-service
          - api-gateway
          - frontend
      target:
        description: Destination target environment.
        required: true
        type: choice
        options: [prod]
      release_id:
        description: Optional release id. Empty means latest release per selected service.
        required: false
        type: string
      reason:
        description: Required promotion reason.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-promote-${{ inputs.target }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'custoking' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-south2' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
  PROMOTER_SERVICE_ACCOUNT: ${{ vars.PROMOTER_SERVICE_ACCOUNT || vars.DEPLOY_SERVICE_ACCOUNT }}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PROMOTER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Promote selected releases
        shell: pwsh
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID: ${{ vars.STUDENT_PHOTO_IMPORT_DRIVE_ROOT_FOLDER_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          $requested = '${{ inputs.service }}'
          $target = '${{ inputs.target }}'
          ./scripts/render-clouddeploy-targets.ps1 -Environment $target -OutputPath "artifacts/clouddeploy/targets-$target.rendered.yaml"
          gcloud deploy apply --file="artifacts/clouddeploy/targets-$target.rendered.yaml" --project="$env:GCP_PROJECT_ID" --region="$env:GCP_REGION"
          $services = if ($requested -eq 'all') {
            @("school-core-service", "identity-service", "operations-service", "billing-service", "platform-service", "api-gateway", "frontend")
          } else {
            @($requested)
          }
          New-Item -ItemType Directory -Force -Path promotion-evidence | Out-Null
          $summary = @()
          foreach ($service in $services) {
            $pipeline = "custoking-$service"
            $release = '${{ inputs.release_id }}'
            if ([string]::IsNullOrWhiteSpace($release)) {
              $fullName = gcloud deploy releases list `
                --project="$env:GCP_PROJECT_ID" `
                --region="$env:GCP_REGION" `
                --delivery-pipeline="$pipeline" `
                --sort-by="~createTime" `
                --limit=1 `
                --format="value(name)"
              if ([string]::IsNullOrWhiteSpace($fullName)) {
                throw "No release found for $pipeline"
              }
              $release = $fullName.Split("/")[-1]
            }
            $targetId = "$service-$target"
            gcloud deploy releases promote `
              --project="$env:GCP_PROJECT_ID" `
              --region="$env:GCP_REGION" `
              --delivery-pipeline="$pipeline" `
              --release="$release" `
              --to-target="$targetId" `
              --quiet
            $summary += [ordered]@{ service = $service; pipeline = $pipeline; release = $release; target = $targetId }
          }
          [ordered]@{
            target = $target
            reason = '${{ inputs.reason }}'
            promotedAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            releases = $summary
          } | ConvertTo-Json -Depth 10 | Set-Content promotion-evidence/promotion.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-${{ inputs.target }}-${{ github.run_id }}
          path: promotion-evidence
          if-no-files-found: error
