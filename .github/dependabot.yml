version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      workflow-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /frontend
      - /services/api-gateway
      - /services/billing-service
      - /services/identity-service
      - /services/operations-service
      - /services/platform-service
      - /services/school-core-service
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      runtime-base-images:
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Node 24 and Java 25 are repository-wide runtime contracts. Upgrade them
      # explicitly with their manifests, CI images, and production images.
      - dependency-name: node
        versions: [">= 25"]
      # Maven image tags encode the JDK track in a suffix, so Dependabot cannot
      # reliably apply a SemVer range. Keep the Java 25 build image pinned until
      # the repository-wide Java runtime upgrade is performed explicitly.
      - dependency-name: maven

  - package-ecosystem: npm
    directories:
      - /frontend
      - /services/api-gateway
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-opentelemetry:
        patterns: ["@opentelemetry/*"]
        update-types: [minor, patch]
      npm-vite-toolchain:
        dependency-type: development
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
        update-types: [minor, patch]
      npm-runtime:
        dependency-type: production
        patterns: ["*"]
        exclude-patterns: ["@opentelemetry/*"]
        update-types: [minor, patch]
        group-by: dependency-name
      npm-development:
        dependency-type: development
        patterns: ["*"]
        exclude-patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
        update-types: [minor, patch]
        group-by: dependency-name
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The gateway stays on the OpenTelemetry JS SDK 2.x line until the 3.x
      # migration is done on purpose. The 3.x generation arrives as 0.x
      # "minor" bumps (auto-instrumentations 0.82+, sdk-node and the OTLP
      # exporter 0.300+) plus API 1.10, which SDK 2.x cannot be installed
      # with, so the npm-opentelemetry group kept proposing a set that fails
      # npm ci with ERESOLVE (#375, #378). Patches on the 2.x line still flow.
      # Remove these entries in the PR that migrates services/api-gateway to
      # 3.x; the work is listed under "OpenTelemetry JS 3.x follow-up" in
      # docs/security-remediation/dependency-reconciliation-2026-11-14.md.
      - dependency-name: "@opentelemetry/auto-instrumentations-node"
        versions: [">= 0.82.0"]
      - dependency-name: "@opentelemetry/sdk-node"
        versions: [">= 0.300.0"]
      - dependency-name: "@opentelemetry/exporter-trace-otlp-proto"
        versions: [">= 0.300.0"]
      - dependency-name: "@opentelemetry/api"
        versions: [">= 1.10.0"]
      # Already a semver-major, but named so the 2.x pin survives any change
      # to the wildcard rule above. sdk-trace-base has no 3.x: it is replaced
      # by @opentelemetry/sdk-trace, which the migration adds.
      - dependency-name: "@opentelemetry/resources"
        versions: [">= 3.0.0"]

  - package-ecosystem: maven
    directories:
      # The repository parent owns Spring Boot, Java, Google Cloud, gRPC,
      # PostgreSQL, logging, auth, and Enforcer versions. Keep it in the update
      # graph as well as service-local dependencies.
      - /
      - /services/billing-service
      - /services/identity-service
      - /services/operations-service
      - /services/platform-service
      - /services/school-core-service
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      maven-jjwt:
        dependency-type: production
        patterns: ["io.jsonwebtoken:*"]
        update-types: [minor, patch]
      maven-runtime:
        dependency-type: production
        patterns: ["*"]
        exclude-patterns: ["io.jsonwebtoken:*"]
        update-types: [minor, patch]
        group-by: dependency-name
      maven-development:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
        group-by: dependency-name
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
