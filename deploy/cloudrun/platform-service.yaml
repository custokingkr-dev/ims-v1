apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: custoking-platform-service-dev # from-param: custoking-platform-service-${env}
  labels:
    app: custoking-ims
    component: cloud-run
    service: platform-service
    env: dev # from-param: ${env}
    owner: engineering
    cost-center: school-saas
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0" # from-param: ${domain_min_instances}
        autoscaling.knative.dev/maxScale: "2" # from-param: ${domain_max_instances}
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/network-interfaces: '[{"network":"default","subnetwork":"default"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only # from-param: ${vpc_egress}
    spec:
      serviceAccountName: 305630109861-compute@developer.gserviceaccount.com # from-param: ${runtime_service_account}
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: custoking-platform-service
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://placeholder:5432/app # from-param: jdbc:postgresql://${db_host}/${db_name}
            - name: SPRING_DATASOURCE_USERNAME
              value: app_rt
            - name: FLYWAY_URL
              value: jdbc:postgresql://placeholder:5432/app # from-param: jdbc:postgresql://${db_host}/${db_name}
            - name: FLYWAY_USERNAME
              value: appuser
            - name: PLATFORM_DB_SCHEMA
              value: reporting,notification,audit
            - name: MSG91_DRY_RUN
              value: "true" # from-param: ${msg91_dry_run}
            - name: NOTIFICATION_DELIVERY_PROVIDER
              value: logging # from-param: ${notification_delivery_provider}
            - name: SCHOOL_CORE_URL
              value: https://custoking-school-core-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${school_core_url}
            - name: OPERATIONS_URL
              value: https://custoking-operations-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${operations_url}
            - name: GCP_PROJECT
              value: custoking # from-param: ${project_id}
            - name: GOOGLE_CLOUD_PROJECT
              value: custoking # from-param: ${project_id}
            - name: GOOGLE_CLOUD_QUOTA_PROJECT
              value: custoking # from-param: ${project_id}
            - name: REPORTING_PUBSUB_REQUIRE_SHARED_TOKEN
              value: "true" # from-param: ${reporting_pubsub_require_shared_token}
            - name: NOTIFICATION_PUBSUB_REQUIRE_SHARED_TOKEN
              value: "true" # from-param: ${notification_pubsub_require_shared_token}
            - name: OTEL_SERVICE_NAME
              value: platform-service
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://telemetry.googleapis.com
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: https://telemetry.googleapis.com/v1/traces
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.05" # from-param: ${otel_sample}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: gcp.project_id=custoking # from-param: gcp.project_id=${project_id}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-rt-password-dev # from-param: app-rt-password-${env}
                  key: latest
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password-dev # from-param: db-password-${env}
                  key: latest
            - name: REPORTING_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reporting-read-token-dev # from-param: reporting-read-token-${env}
                  key: latest
            - name: AUDIT_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: audit-ingest-token-dev # from-param: audit-ingest-token-${env}
                  key: latest
            - name: NOTIFICATION_STATUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-status-token-dev # from-param: notification-status-token-${env}
                  key: latest
            - name: MSG91_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: msg91-auth-key-dev # from-param: msg91-auth-key-${env}
                  key: latest
            - name: CATALOG_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-read-token-dev # from-param: catalog-read-token-${env}
                  key: latest
            - name: FIREFIGHTING_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefighting-read-token-dev # from-param: firefighting-read-token-${env}
                  key: latest
