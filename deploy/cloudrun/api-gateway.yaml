apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: custoking-api-gateway-dev # from-param: custoking-api-gateway-${env}
  labels:
    app: custoking-ims
    component: cloud-run
    service: api-gateway
    env: dev # from-param: ${env}
    owner: engineering
    cost-center: school-saas
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0" # from-param: ${gateway_min_instances}
        autoscaling.knative.dev/maxScale: "4" # from-param: ${gateway_max_instances}
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: 305630109861-compute@developer.gserviceaccount.com # from-param: ${runtime_service_account}
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: custoking-api-gateway
          ports:
            - name: http1
              containerPort: 80
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /gateway-health
              port: 80
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /gateway-health
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: NODE_ENV
              value: production
            - name: GATEWAY_AUTH_MODE
              value: enforce
            - name: GATEWAY_CLOUD_RUN_AUTH
              value: auto
            - name: GATEWAY_LOCAL_JWT_VERIFY
              value: enabled
            - name: GATEWAY_CORS_ALLOWED_ORIGINS
              value: https://custoking-frontend-dev-l7mhms5c2a-em.a.run.app # from-param: ${frontend_url}
            - name: FRONTEND_UPSTREAM
              value: https://custoking-frontend-dev-l7mhms5c2a-em.a.run.app # from-param: ${frontend_url}
            - name: IDENTITY_UPSTREAM
              value: https://custoking-identity-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${identity_url}
            - name: TENANT_SCHOOL_UPSTREAM
              value: https://custoking-school-core-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${school_core_url}
            - name: STUDENT_UPSTREAM
              value: https://custoking-school-core-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${school_core_url}
            - name: ATTENDANCE_UPSTREAM
              value: https://custoking-school-core-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${school_core_url}
            - name: FEE_UPSTREAM
              value: https://custoking-school-core-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${school_core_url}
            - name: CATALOG_UPSTREAM
              value: https://custoking-school-core-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${school_core_url}
            - name: WORKFLOW_UPSTREAM
              value: https://custoking-operations-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${operations_url}
            - name: FIREFIGHTING_UPSTREAM
              value: https://custoking-operations-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${operations_url}
            - name: REPORTING_UPSTREAM
              value: https://custoking-platform-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${platform_url}
            - name: AUDIT_UPSTREAM
              value: https://custoking-platform-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${platform_url}
            - name: NOTIFICATION_UPSTREAM
              value: https://custoking-platform-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${platform_url}
            - name: BILLING_UPSTREAM
              value: https://custoking-billing-service-dev-l7mhms5c2a-em.a.run.app # from-param: ${billing_url}
            - name: GCP_PROJECT
              value: custoking # from-param: ${project_id}
            - name: GOOGLE_CLOUD_PROJECT
              value: custoking # from-param: ${project_id}
            - name: OTEL_SERVICE_NAME
              value: api-gateway
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://telemetry.googleapis.com
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: https://telemetry.googleapis.com/v1/traces
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.05" # from-param: ${otel_sample}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: gcp.project_id=custoking # from-param: gcp.project_id=${project_id}
            - name: IDENTITY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: identity-introspection-token-dev # from-param: identity-introspection-token-${env}
                  key: latest
            - name: TENANT_SCHOOL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tenant-school-read-token-dev # from-param: tenant-school-read-token-${env}
                  key: latest
            - name: STUDENT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: student-read-token-dev # from-param: student-read-token-${env}
                  key: latest
            - name: ATTENDANCE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: attendance-read-token-dev # from-param: attendance-read-token-${env}
                  key: latest
            - name: FEE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fee-read-token-dev # from-param: fee-read-token-${env}
                  key: latest
            - name: CATALOG_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: catalog-read-token-dev # from-param: catalog-read-token-${env}
                  key: latest
            - name: WORKFLOW_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: workflow-read-token-dev # from-param: workflow-read-token-${env}
                  key: latest
            - name: FIREFIGHTING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefighting-read-token-dev # from-param: firefighting-read-token-${env}
                  key: latest
            - name: REPORTING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reporting-read-token-dev # from-param: reporting-read-token-${env}
                  key: latest
            - name: BILLING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: billing-service-token-dev # from-param: billing-service-token-${env}
                  key: latest
            - name: AUDIT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: audit-ingest-token-dev # from-param: audit-ingest-token-${env}
                  key: latest
            - name: NOTIFICATION_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-status-token-dev # from-param: notification-status-token-${env}
                  key: latest
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret-dev # from-param: jwt-secret-${env}
                  key: latest
