apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: custoking-frontend-dev # from-param: custoking-frontend-${env}
  labels:
    app: custoking-ims
    component: cloud-run
    service: frontend
    env: dev # from-param: ${env}
    owner: engineering
    cost-center: school-saas
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2" # from-param: ${frontend_max_instances}
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false" # from-param: ${startup_cpu_boost}
    spec:
      serviceAccountName: 305630109861-compute@developer.gserviceaccount.com # from-param: ${runtime_service_account}
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: custoking-frontend
          ports:
            - name: http1
              containerPort: 80
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: API_UPSTREAM
              value: https://custoking-api-gateway-dev-l7mhms5c2a-em.a.run.app # from-param: ${gateway_url}
