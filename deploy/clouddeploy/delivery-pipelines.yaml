apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: custoking-identity-service-dev
  labels: {app: custoking-ims, env: dev, service: identity-service}
description: identity-service dev branch Cloud Run delivery
serialPipeline:
  stages:
    - targetId: identity-service-dev
      profiles: [identity-service]
      strategy:
        standard: {}
---
apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: custoking-identity-service-prod
  labels: {app: custoking-ims, env: prod, service: identity-service}
description: identity-service main branch Cloud Run delivery
serialPipeline:
  stages:
    - targetId: identity-service-prod
      profiles: [identity-service]
      strategy:
        canary:
          runtimeConfig:
            cloudRun:
              automaticTrafficControl: true
          canaryDeployment:
            percentages: [5, 25, 100]
---
