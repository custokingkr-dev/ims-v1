apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: custoking-identity-service
  labels:
    app: custoking-ims
    service: identity-service
description: identity-service dev -> prod Cloud Run delivery
serialPipeline:
  stages:
    - targetId: identity-service-dev
      profiles: [identity-service]
      strategy:
        standard: {}
    - targetId: identity-service-prod
      profiles: [identity-service]
      strategy:
        canary:
          runtimeConfig:
            cloudRun:
              automaticTrafficControl: true
          canaryDeployment:
            percentages: [5, 25, 100]
---
