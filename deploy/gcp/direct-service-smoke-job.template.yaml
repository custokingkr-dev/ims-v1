apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ims-direct-service-smoke
  labels:
    app.kubernetes.io/name: custoking
    app.kubernetes.io/component: production-smoke
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: __DIRECT_SMOKE_SERVICE_ACCOUNT__
          maxRetries: 0
          timeoutSeconds: 300
          containers:
            - image: python:3.12-slim
              command:
                - python
              args:
                - -c
                - |
                  import json
                  import os
                  import urllib.error
                  import urllib.request

                  def required_env(name):
                      value = os.environ[name].strip()
                      if not value:
                          raise RuntimeError(f"{name} is empty")
                      return value

                  CATALOG_URL = required_env("CATALOG_URL").rstrip("/")
                  TENANT_URL = required_env("TENANT_URL").rstrip("/")
                  SCHOOL_ID = os.environ.get("SMOKE_SCHOOL_ID", "").strip()
                  USER_ID = os.environ.get("SMOKE_USER_ID", "").strip()
                  CATALOG_TOKEN = required_env("CATALOG_TOKEN")
                  TENANT_TOKEN = required_env("TENANT_TOKEN")
                  META = "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience={}&format=full"

                  def request(url, headers=None, method="GET", body=None):
                      data = None if body is None else json.dumps(body).encode()
                      merged_headers = {} if headers is None else dict(headers)
                      if body is not None:
                          merged_headers["Content-Type"] = "application/json"
                      req = urllib.request.Request(url, data=data, headers=merged_headers, method=method)
                      try:
                          with urllib.request.urlopen(req, timeout=30) as response:
                              return response.status, response.read(4096).decode(errors="replace")
                      except urllib.error.HTTPError as exc:
                          exc.close()
                          return exc.code, ""

                  def identity_token(audience):
                      status, token = request(META.format(audience), {"Metadata-Flavor": "Google"})
                      if status != 200 or not token:
                          raise RuntimeError("identity token missing")
                      return token.strip()

                  # First prove IAM + peer token alone cannot impersonate a user on business routes.
                  catalog_headers = {"Authorization": "Bearer " + identity_token(CATALOG_URL), "X-Catalog-Service-Token": CATALOG_TOKEN}
                  tenant_headers = {"Authorization": "Bearer " + identity_token(TENANT_URL), "X-Tenant-School-Token": TENANT_TOKEN}
                  denied_school = SCHOOL_ID if SCHOOL_ID else "1"
                  for name, url, headers in [
                      ("catalog user boundary", f"{CATALOG_URL}/api/v1/catalog/annual-plan?schoolId={denied_school}", catalog_headers),
                      ("tenant user boundary", f"{TENANT_URL}/api/v1/schools/{denied_school}/modules", tenant_headers),
                  ]:
                      status, _ = request(url, headers)
                      if status not in (401, 403):
                          raise RuntimeError(f"{name} expected denial, received HTTP {status}")
                      print(name, status)

                  # Optional positive READ-ONLY domain smoke uses an explicitly configured dedicated actor.
                  # It never discovers all schools, manufactures a SUPERADMIN, or writes/deletes entitlements.
                  if USER_ID:
                      if not USER_ID.isdecimal() or int(USER_ID) <= 0 or not SCHOOL_ID.isdecimal() or int(SCHOOL_ID) <= 0:
                          raise RuntimeError("Dedicated smoke actor and school must be positive IDs")
                      auth_ctx = {
                          "X-Authenticated-User-Id": USER_ID,
                          "X-Authenticated-Role": "SCHOOL_ADMIN",
                          "X-Authenticated-School-Id": SCHOOL_ID,
                          "X-Authenticated-Permissions": "order:read,school:read",
                      }
                      for name, url, headers in [
                          ("catalog annual-plan read", f"{CATALOG_URL}/api/v1/catalog/annual-plan?schoolId={SCHOOL_ID}", catalog_headers),
                          ("tenant modules read", f"{TENANT_URL}/api/v1/schools/{SCHOOL_ID}/modules", tenant_headers),
                      ]:
                          status, _ = request(url, {**headers, **auth_ctx})
                          if status != 200:
                              raise RuntimeError(f"{name} expected HTTP 200, received {status}")
                          print(name, status)
                  else:
                      print("positive domain read smoke omitted: configure a dedicated actor and school")
              env:
                - name: CATALOG_URL
                  value: "__CATALOG_URL__"
                - name: TENANT_URL
                  value: "__TENANT_URL__"
                - name: SMOKE_SCHOOL_ID
                  value: "__SMOKE_SCHOOL_ID__"
                - name: SMOKE_USER_ID
                  value: "__SMOKE_USER_ID__"
                - name: CATALOG_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: __CATALOG_TOKEN_SECRET__
                      key: latest
                - name: TENANT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: __TENANT_TOKEN_SECRET__
                      key: latest
