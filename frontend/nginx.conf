server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  client_max_body_size 8m;

  location /api/v1/ {
    # Resolve the upstream lazily (per-request) via a variable + resolver, rather than at
    # startup: on a first deploy the gateway may not exist yet, and a static proxy_pass would
    # fail nginx startup ("host not found in upstream"). This keeps nginx booting regardless;
    # requests 502 until the real gateway URL is wired in, then recover automatically.
    resolver 8.8.8.8 8.8.4.4 valid=30s;
    set $api_upstream ${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A real health endpoint, above the catch-all so try_files cannot swallow it.
  #
  # Without this, ANY unknown path -- /health, /nonsense -- returns index.html with a 200, because
  # try_files falls back to the SPA. A status-code uptime check against such a path passes whatever
  # the state of the application, which is worse than no check: it reports green by construction.
  # "UP" matches the content matcher the backend services already use.
  #
  # NOT /healthz. That path is RESERVED by Cloud Run's front end and never reaches the container --
  # measured on three unrelated services (this nginx image, the Node gateway, a Java service) across
  # two projects: /healthz returns a Google-branded 404 every time while /healthz/ and /zzz reach the
  # app normally, and no request for /healthz appears in the Cloud Run request log at all. The name
  # here follows the existing /gateway-health convention instead.
  location = /frontend-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "UP
";
  }

  # Vite filenames are content-hashed, so assets can be cached forever. Missing assets must be a
  # real 404: returning index.html for an old chunk URL makes the browser try to parse HTML as
  # JavaScript after a rollout and leaves an otherwise valid signed-in session on the error page.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The application shell names the current content-hashed assets and therefore must be revalidated
  # on every navigation. This prevents a browser from retaining an old index across Cloud Run
  # revisions after the old revision and its chunks have been retired.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
