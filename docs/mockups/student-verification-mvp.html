<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students View Verification Mockup</title>
  <style>
    :root {
      --ink: #182027;
      --muted: #68737f;
      --line: #d9e0e7;
      --soft: #f6f8f9;
      --brand: #275d50;
      --warn: #8a5b10;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef2f4;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .page {
      max-width: 980px;
      margin: 28px auto;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 600;
      white-space: nowrap;
    }
    .primary { background: var(--brand); border-color: var(--brand); color: white; }
    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      border: 0;
      background: transparent;
      padding: 10px 12px;
      font: inherit;
      font-weight: 650;
      color: var(--muted);
      border-bottom: 3px solid transparent;
    }
    .tabs .on { color: var(--brand); border-bottom-color: var(--brand); }
    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .filters, .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    select, input {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      background: white;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    th { color: var(--muted); font-size: 12px; font-weight: 650; }
    .student {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 35%, #d7aa82 0 24%, transparent 25%),
        radial-gradient(circle at 50% 95%, #314f63 0 42%, transparent 43%),
        #e4eaee;
      flex: 0 0 auto;
    }
    .name { font-weight: 650; }
    .pill {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .pending { color: var(--warn); background: #fff4d8; }
    .done { color: var(--brand); background: #e7f2ee; }
    .drawer {
      border-top: 1px solid var(--line);
      background: var(--soft);
      padding: 16px;
    }
    .drawer-inner {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .portrait {
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 30%, #d7aa82 0 19%, transparent 20%),
        radial-gradient(circle at 50% 78%, #314f63 0 36%, transparent 37%),
        linear-gradient(#dfe7eb, #f7f8f9);
    }
    .checks { display: grid; gap: 8px; }
    label {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 600;
    }
    @media (max-width: 760px) {
      .page { margin: 0; border-radius: 0; }
      header, .toolbar, .drawer-inner { display: block; }
      .actions, .filters { margin-top: 8px; }
      .portrait { max-width: 130px; margin-bottom: 12px; }
      table { display: block; overflow-x: auto; }
      .drawer-inner .btn { margin-top: 12px; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Students</h1>
        <div class="muted">Student records, enrollment, bulk import</div>
      </div>
      <button class="btn primary">Add student</button>
    </header>

    <nav class="tabs" aria-label="Student management">
      <button class="on">Students</button>
      <button>Add Student</button>
      <button>Bulk Import</button>
    </nav>

    <section class="toolbar">
      <div class="filters">
        <select aria-label="Class"><option>All classes</option></select>
        <select aria-label="Section"><option>All sections</option></select>
        <input aria-label="Search" placeholder="Search students">
      </div>
      <div class="actions">
        <button class="btn">Verify profiles</button>
        <button class="btn">Verify photos</button>
      </div>
    </section>

    <table>
      <thead>
        <tr><th>Student</th><th>Class</th><th>Profile</th><th>Photo</th></tr>
      </thead>
      <tbody>
        <tr>
          <td><div class="student"><span class="avatar"></span><span><span class="name">Aarav Mehta</span><br><span class="muted">ADM-0831</span></span></div></td>
          <td>8 A</td>
          <td><span class="pill pending">Pending</span></td>
          <td><span class="pill pending">Pending</span></td>
        </tr>
        <tr>
          <td><div class="student"><span class="avatar"></span><span><span class="name">Sara Khan</span><br><span class="muted">ADM-0832</span></span></div></td>
          <td>8 A</td>
          <td><span class="pill done">Done</span></td>
          <td><span class="pill pending">Needs correction</span></td>
        </tr>
      </tbody>
    </table>

    <section class="drawer" aria-label="Example opened from Verify photos">
      <div class="drawer-inner">
        <div class="portrait" role="img" aria-label="Student portrait preview"></div>
        <div>
          <strong>Photo verification / Aarav Mehta</strong>
          <div class="muted">Opened from Students using current class, section, and search filters.</div>
          <div class="checks">
            <label><input type="checkbox"> Photo belongs to this student</label>
            <label><input type="checkbox"> Photo is clear enough for ID card</label>
          </div>
        </div>
        <button class="btn primary">Save review</button>
      </div>
    </section>
  </div>
</body>
</html>
